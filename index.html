<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Inkwell — Smart Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink:     #1B1D2E;
  --chrome:  #1B1D2E;
  --chrome2: #252738;
  --blue:    #4361EE;
  --purple:  #7C3AED;
  --red:     #EF4444;
  --amber:   #F59E0B;
  --green:   #22C55E;
  --muted:   #8B8C9E;
  --border:  #EBEBF0;
  --th: 58px;
  --pw: 360px;
}

html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: #E5E5EA; /* Desk background */
  font-family: 'DM Sans', system-ui, sans-serif;
  color: var(--ink);
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
}

/* ── TOOLBAR ─────────────────────────────────── */
#toolbar {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--th);
  background: var(--chrome);
  display: flex; align-items: center;
  padding: 0 10px; gap: 3px;
  z-index: 200;
  box-shadow: 0 1px 0 rgba(255,255,255,0.05), 0 4px 20px rgba(0,0,0,0.25);
}

.logo {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 17px; font-weight: 600;
  color: white; letter-spacing: -0.3px;
  padding: 0 6px 0 2px; white-space: nowrap; flex-shrink: 0;
  display: flex; align-items: center; gap: 7px;
}

.sep {
  width: 1px; height: 20px;
  background: rgba(255,255,255,0.12);
  margin: 0 4px; flex-shrink: 0;
}

.tb {
  width: 34px; height: 34px; border-radius: 8px;
  border: none; background: transparent;
  color: rgba(255,255,255,0.55);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  position: relative; flex-shrink: 0;
  transition: background .15s, color .15s;
}
.tb:hover { background: rgba(255,255,255,0.1); color: white; }
.tb.on { background: rgba(255,255,255,0.14); color: white; }
.tb.on::after {
  content: ''; position: absolute;
  bottom: 3px; left: 50%; transform: translateX(-50%);
  width: 14px; height: 2.5px; border-radius: 2px;
  background: var(--blue);
}
[data-tool="select"].on::after { background: var(--purple); }
[data-tool="highlighter"].on::after { background: var(--amber); }
[data-tool="eraser"].on::after { background: var(--muted); }

.spacer { flex: 1; }

/* Colors */
#colors { display: flex; gap: 5px; align-items: center; flex-shrink: 0; }
.csw {
  width: 19px; height: 19px; border-radius: 50%;
  cursor: pointer; border: 2.5px solid transparent;
  transition: transform .15s, border-color .15s; flex-shrink: 0;
  position: relative;
}
.csw:hover { transform: scale(1.2); }
.csw.on { border-color: white; transform: scale(1.1); }
#custom-csw { background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red); overflow: hidden; }
#custom-color { position: absolute; inset: -5px; opacity: 0; cursor: pointer; width: 30px; height: 30px; }

/* Size Slider */
#sz-wrap { display: flex; align-items: center; gap: 6px; flex-shrink: 0; background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 8px; }
.sz-lbl { font-size: 10px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: .5px; margin-right: 2px; }
.sz-btn { background: transparent; border: none; color: white; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 4px; }
.sz-btn:hover { background: rgba(255,255,255,0.15); }
#sz { width: 60px; accent-color: var(--blue); }
#sz-val { color: white; font-size: 11.5px; font-weight: 600; font-family: monospace; width: 18px; text-align: center; }

/* AI & Action Buttons */
.action-btn {
  display: flex; align-items: center; gap: 5px;
  height: 32px; padding: 0 11px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.18);
  background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.85); font-size: 12px; font-weight: 500;
  font-family: inherit; cursor: pointer; white-space: nowrap;
  flex-shrink: 0; transition: background .15s, border-color .15s;
}
.action-btn:hover { background: rgba(255,255,255,0.15); color: white; border-color: rgba(255,255,255,0.3); }
.action-btn:active { transform: scale(.97); }
#ai-btn { background: linear-gradient(135deg, #7C3AED 0%, #4361EE 100%); border: none; color: white; font-weight: 600; padding: 0 13px; }
#ai-btn:hover { opacity: .9; }

/* ── SETTINGS MENUS ───────────────────────────── */
.popover {
  position: absolute; top: 50px; background: white; border-radius: 12px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.15); padding: 12px; z-index: 250;
  display: none; flex-direction: column; gap: 10px; width: 220px;
  border: 1px solid var(--border);
}
.popover.show { display: flex; }
.pop-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pop-lbl { font-size: 12px; font-weight: 600; color: var(--ink); }
.pop-sel { flex: 1; padding: 5px; border-radius: 6px; border: 1px solid var(--border); font-size: 12px; font-family: inherit; outline: none; }
.pop-rng { flex: 1; accent-color: var(--blue); }
#page-color-pick { width: 30px; height: 24px; border: none; cursor: pointer; padding: 0; background: none; }

/* ── CANVAS AREA ──────────────────────────────── */
#area { position: fixed; top: var(--th); left: 0; right: 0; bottom: 0; overflow: hidden; background: #E5E5EA; }
#bg-cv, #cv { position: absolute; top: 0; left: 0; touch-action: none; display: block; }
#bg-cv { z-index: 1; pointer-events: none; }
#cv { z-index: 2; cursor: crosshair; }

/* ── SELECTION BOX ────────────────────────────── */
#sel {
  position: fixed; border: 2px dashed var(--purple); background: rgba(124,58,237,0.07);
  pointer-events: none; z-index: 100; display: none; border-radius: 4px;
}

/* ── CURSOR PREVIEW ───────────────────────────── */
#cur-prev {
  position: fixed; border-radius: 50%; pointer-events: none; z-index: 90; display: none;
  transform: translate(-50%,-50%); transition: width .1s, height .1s;
}

/* ── AI PANEL ─────────────────────────────────── */
#panel {
  position: fixed; top: var(--th); right: 0; width: var(--pw); bottom: 0;
  background: #FEFEFE; box-shadow: -2px 0 28px rgba(0,0,0,0.1);
  border-left: 1px solid var(--border); display: flex; flex-direction: column;
  transform: translateX(100%); transition: transform .28s cubic-bezier(.4,0,.2,1); z-index: 150;
}
#panel.open { transform: translateX(0); }
#ph { padding: 13px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; background: white; }
.ph-icon { display: flex; align-items: center; color: var(--purple); }
.pt { font-size: 14px; font-weight: 600; flex: 1; }
#cls { width: 26px; height: 26px; border-radius: 6px; border: none; background: #F0F0F4; cursor: pointer; display: flex; align-items: center; justify-content: center; }
#cls:hover { background: #E4E4EC; }
#ks, #mr { padding: 10px 14px; border-bottom: 1px solid var(--border); background: #FAFAFA; display: flex; flex-direction: column; gap: 6px; }
.sl { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
.kr { display: flex; gap: 6px; }
#ki, #ms { height: 33px; padding: 0 10px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 12px; font-family: inherit; color: var(--ink); background: white; outline: none; width: 100%; }
#ki { font-family: 'Courier New', monospace; }
#ki:focus, #ms:focus { border-color: var(--blue); }
#ks-btn { height: 33px; padding: 0 12px; border-radius: 8px; border: none; background: var(--blue); color: white; font-size: 12px; font-weight: 600; cursor: pointer; }
#qa { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; }
.qb { flex: 1; padding: 9px 6px; border-radius: 10px; border: 1.5px solid var(--border); background: white; font-size: 11.5px; font-weight: 500; color: var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; transition: all .15s; }
.qb svg { width: 20px; height: 20px; color: var(--muted); transition: color .15s; }
.qb:hover { border-color: var(--blue); color: var(--blue); }
.qb:hover svg { color: var(--blue); }
.qb.rdy { border-color: var(--purple); color: var(--purple); background: #F9F5FF; }
.qb.rdy svg { color: var(--purple); }
#msgs { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 9px; scroll-behavior: smooth; }
.bub { max-width: 90%; font-size: 13px; line-height: 1.56; padding: 9px 13px; border-radius: 14px; word-break: break-word; }
.bub.u { align-self: flex-end; background: var(--blue); color: white; border-bottom-right-radius: 4px; }
.bub.a { align-self: flex-start; background: #F2F2F6; color: var(--ink); border-bottom-left-radius: 4px; white-space: pre-wrap; }
.bub.e { align-self: flex-start; background: #FFF0F0; color: var(--red); border-bottom-left-radius: 4px; }
#cf { padding: 10px; border-top: 1px solid var(--border); display: flex; gap: 7px; align-items: flex-end; background: white; }
#ci { flex: 1; min-height: 36px; max-height: 88px; padding: 8px 11px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 13px; font-family: inherit; color: var(--ink); background: #FAFAFA; resize: none; outline: none; line-height: 1.4; }
#ci:focus { border-color: var(--blue); background: white; }
#sb { width: 36px; height: 36px; border-radius: 10px; border: none; background: var(--blue); color: white; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }

/* ── TOAST ────────────────────────────────────── */
#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(8px); background: rgba(27,29,46,.92); backdrop-filter: blur(8px); color: white; padding: 8px 18px; border-radius: 20px; font-size: 12.5px; font-weight: 500; opacity: 0; transition: opacity .24s, transform .24s; pointer-events: none; z-index: 300; white-space: nowrap; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 600px) {
  :root { --pw: 100vw; }
  #sz-wrap { display: none; }
  .logo { font-size: 15px; }
  .action-btn span { display: none; }
}
</style>
</head>
<body>

<div id="toolbar">
  <span class="logo">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
    Inkwell
  </span>
  <div class="sep"></div>

  <button class="tb" id="b-undo" title="Undo (⌘Z)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg></button>
  <button class="tb" id="b-redo" title="Redo (⌘⇧Z)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></svg></button>
  <div class="sep"></div>

  <button class="tb on" data-tool="pen" title="Pen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg></button>
  <button class="tb" data-tool="highlighter" title="Highlighter"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 11l5-5c1.1-1.1 1.1-3 0-4.1-1.1-1.1-3-1.1-4.1 0l-5 5"/><path d="M12 15l-9 6h18"/><path d="M3 15h6v-6h-6v6z"/></svg></button>
  <button class="tb" data-tool="eraser" title="Eraser"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 21L2 16l9-9 11 11-5 5H7z"/><path d="M7 21l4-4"/><path d="M11 7l4 4"/></svg></button>
  <button class="tb" data-tool="select" title="Select Region"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" stroke-dasharray="4 4"/></svg></button>
  <div class="sep"></div>

  <div id="colors">
    <div class="csw on" style="background:#1B1D2E" data-color="#1B1D2E"></div>
    <div class="csw"    style="background:#4361EE" data-color="#4361EE"></div>
    <div class="csw"    style="background:#EF4444" data-color="#EF4444"></div>
    <div class="csw"    style="background:#22C55E" data-color="#22C55E"></div>
    <div class="csw"    style="background:#F59E0B" data-color="#F59E0B"></div>
    <div class="csw" id="custom-csw" title="Custom Color">
      <input type="color" id="custom-color" value="#8B5CF6">
    </div>
  </div>
  <div class="sep"></div>

  <div id="sz-wrap">
    <span class="sz-lbl">Size</span>
    <button class="sz-btn" id="sz-dec">−</button>
    <input type="range" id="sz" min="1" max="24" value="3">
    <button class="sz-btn" id="sz-inc">+</button>
    <span id="sz-val">3</span>
  </div>
  
  <button class="tb" id="b-pen-settings" title="Pen Settings" style="margin-left:5px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>

  <div class="spacer"></div>

  <button class="action-btn" id="b-page-settings" title="Page Settings">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
    <span>Page</span>
  </button>

  <button class="tb" id="b-clr" title="Clear canvas"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>

  <button class="action-btn" id="dl-btn" title="Download as PDF">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    <span>PDF</span>
  </button>

  <button class="action-btn" id="ai-btn">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4L12 2z"/></svg>
    <span>Ask AI</span>
  </button>
</div>

<div id="pen-menu" class="popover" style="left: 310px;">
  <div class="pop-row">
    <span class="pop-lbl">Shape</span>
    <select id="pen-shape" class="pop-sel">
      <option value="round">Round</option>
      <option value="square">Square</option>
    </select>
  </div>
  <div class="pop-row">
    <span class="pop-lbl">Stability</span>
    <input type="range" id="pen-stability" class="pop-rng" min="0" max="0.95" step="0.05" value="0.6">
  </div>
</div>

<div id="page-menu" class="popover" style="right: 170px;">
  <div class="pop-row">
    <span class="pop-lbl">Size</span>
    <select id="page-size" class="pop-sel">
      <option value="inf">Infinite Canvas</option>
      <option value="a4">A4 Portrait</option>
      <option value="letter">US Letter</option>
    </select>
  </div>
  <div class="pop-row">
    <span class="pop-lbl">Pattern</span>
    <select id="page-pattern" class="pop-sel">
      <option value="none">Blank</option>
      <option value="ruled" selected>Ruled</option>
      <option value="grid">Grid</option>
      <option value="dots">Dotted</option>
    </select>
  </div>
  <div class="pop-row">
    <span class="pop-lbl">Color</span>
    <input type="color" id="page-color-pick" value="#FDFBF7">
  </div>
</div>

<div id="area">
  <canvas id="bg-cv"></canvas>
  <canvas id="cv"></canvas>
</div>

<div id="sel"></div>
<div id="cur-prev"></div>

<div id="panel">
  <div id="ph">
    <span class="ph-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4L12 2z"/></svg></span>
    <span class="pt">AI Assistant</span>
    <button id="cls"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
  </div>

  <div id="ks">
    <div class="sl">Groq API Key</div>
    <div class="kr">
      <input type="password" id="ki" placeholder="gsk_…" autocomplete="off" spellcheck="false">
      <button id="ks-btn">Save</button>
    </div>
  </div>

  <div id="mr">
    <span class="sl">Vision Model</span>
    <select id="ms">
      <option value="meta-llama/llama-4-scout-17b-16e-instruct">Llama 4 Scout 17B (Vision ✦)</option>
      <option value="llama-3.2-11b-vision-preview">Llama 3.2 11B Vision</option>
      <option value="llama-3.2-90b-vision-preview">Llama 3.2 90B Vision</option>
    </select>
  </div>

  <div id="qa">
    <button class="qb" id="b-page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      Summarize Page
    </button>
    <button class="qb" id="b-rgn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h3"/><path d="M17 4h3v3"/><path d="M20 17v3h-3"/><path d="M7 20H4v-3"/><circle cx="12" cy="12" r="3"/></svg>
      Analyze Region
    </button>
  </div>

  <div id="msgs"></div>

  <div id="cf">
    <textarea id="ci" placeholder="Ask about your notes…" rows="1"></textarea>
    <button id="sb"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
// ════════════════════════════════════════════════════════
// CORE SETUP
// ════════════════════════════════════════════════════════
const area = document.getElementById('area');
const bgCv = document.getElementById('bg-cv');
const bgCtx= bgCv.getContext('2d');
const cv   = document.getElementById('cv');
const ctx  = cv.getContext('2d');
const selEl= document.getElementById('sel');
const cpEl = document.getElementById('cur-prev');

let dpr = window.devicePixelRatio || 1;
let vx = 0, vy = 0, vs = 1;

// Stroke memory
let strokes = [];
let redos   = [];
let cur     = null;
let penDown = false;

// Tool state
let tool  = 'pen';
let color = '#1B1D2E';
let size  = 3;

// Pointer / Touch tracking
const ptrs = new Map();
let pinch = { dist: 0, vx: 0, vy: 0, vs: 0, mx: 0, my: 0 };
let pan   = { cx: 0, cy: 0, vx: 0, vy: 0 };
let inTouch = false;
let lastPtRaw = null; // Used for stabilization

// Selection
let selActive = false;
let selStart  = { x: 0, y: 0 };
let selRect   = null;
let captured  = null;

// Settings State
const pageOpts = { size: 'inf', pattern: 'ruled', color: '#FDFBF7' }; // a4=794x1123, letter=816x1056
const penOpts  = { shape: 'round', stability: 0.6 };

// ════════════════════════════════════════════════════════
// RESIZE & COORDINATES
// ════════════════════════════════════════════════════════
function resize() {
  dpr = window.devicePixelRatio || 1;
  const W = area.clientWidth, H = area.clientHeight;
  bgCv.width = cv.width = Math.round(W * dpr);
  bgCv.height = cv.height = Math.round(H * dpr);
  bgCv.style.width = cv.style.width = W + 'px';
  bgCv.style.height = cv.style.height = H + 'px';
  draw();
}
window.addEventListener('resize', resize);
resize();

function areaRect() { return area.getBoundingClientRect(); }
function s2c(sx, sy) { return { x: (sx - vx) / vs, y: (sy - vy) / vs }; }
function evXY(e) { const r = areaRect(); return { sx: e.clientX - r.left, sy: e.clientY - r.top }; }
function getPageBounds() {
  if (pageOpts.size === 'a4') return { w: 794, h: 1123 };
  if (pageOpts.size === 'letter') return { w: 816, h: 1056 };
  return null;
}

// ════════════════════════════════════════════════════════
// DRAWING ENGINE
// ════════════════════════════════════════════════════════
function draw() {
  const W = cv.clientWidth, H = cv.clientHeight;
  const bounds = getPageBounds();
  
  // 1. Render Background Layer (Immutable bounds & patterns)
  bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  bgCtx.clearRect(0, 0, W, H);
  
  if (bounds) {
    // Fixed Page Bounds (A4 / Letter)
    bgCtx.save();
    bgCtx.translate(vx, vy); bgCtx.scale(vs, vs);
    
    // Drop shadow around page
    bgCtx.shadowColor = 'rgba(0,0,0,0.15)';
    bgCtx.shadowBlur = 30; bgCtx.shadowOffsetY = 10;
    bgCtx.fillStyle = pageOpts.color;
    bgCtx.fillRect(0, 0, bounds.w, bounds.h);
    bgCtx.shadowColor = 'transparent'; // reset
    
    drawPattern(bgCtx, 0, 0, bounds.w, bounds.h);
    bgCtx.restore();
  } else {
    // Infinite Canvas
    bgCtx.fillStyle = pageOpts.color;
    bgCtx.fillRect(0, 0, W, H);
    
    bgCtx.save();
    bgCtx.translate(vx, vy); bgCtx.scale(vs, vs);
    const sX = -vx/vs, sY = -vy/vs, eX = sX + W/vs, eY = sY + H/vs;
    drawPattern(bgCtx, sX, sY, eX, eY);
    bgCtx.restore();
  }

  // 2. Render Ink Layer
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(vx, vy); ctx.scale(vs, vs);

  for (const st of strokes) renderStroke(ctx, st);
  if (cur?.pts.length) renderStroke(ctx, cur);

  ctx.restore();
}

function drawPattern(c, sx, sy, ex, ey) {
  if (pageOpts.pattern === 'none') return;
  c.strokeStyle = 'rgba(67,97,238,0.08)'; c.lineWidth = 1;
  c.fillStyle = 'rgba(67,97,238,0.15)';
  
  if (pageOpts.pattern === 'ruled') {
    const sp = 32;
    const sY = Math.floor(sy / sp) * sp;
    for (let y = sY; y < ey; y += sp) {
      if(y <= 0 && getPageBounds()) continue;
      c.beginPath(); c.moveTo(sx, y); c.lineTo(ex, y); c.stroke();
    }
    // Margin line
    c.strokeStyle = 'rgba(239,68,68,0.15)';
    c.beginPath(); c.moveTo(60, Math.max(sy,0)); c.lineTo(60, ey); c.stroke();
  } 
  else if (pageOpts.pattern === 'grid') {
    const sp = 24;
    const sY = Math.floor(sy / sp) * sp, sX = Math.floor(sx / sp) * sp;
    c.beginPath();
    for (let y = sY; y < ey; y += sp) { c.moveTo(sx, y); c.lineTo(ex, y); }
    for (let x = sX; x < ex; x += sp) { c.moveTo(x, sy); c.lineTo(x, ey); }
    c.stroke();
  }
  else if (pageOpts.pattern === 'dots') {
    const sp = 24;
    const sY = Math.floor(sy / sp) * sp, sX = Math.floor(sx / sp) * sp;
    for (let y = sY; y < ey; y += sp) {
      for (let x = sX; x < ex; x += sp) {
        c.beginPath(); c.arc(x, y, 1.2, 0, Math.PI*2); c.fill();
      }
    }
  }
}

function renderStroke(c, st) {
  const pts = st.pts;
  if (!pts.length) return;

  c.save();
  c.lineJoin = st.shape === 'round' ? 'round' : 'bevel';
  c.lineCap = st.shape;
  c.globalCompositeOperation = 'source-over';

  if (st.tool === 'eraser') {
    c.globalCompositeOperation = 'destination-out';
    c.strokeStyle = 'rgba(0,0,0,1)';
    c.fillStyle = 'rgba(0,0,0,1)';
    c.lineWidth = st.size * 2.5;
  } else if (st.tool === 'highlighter') {
    c.strokeStyle = hexA(st.color, 0.3);
    c.fillStyle = hexA(st.color, 0.3);
    c.lineWidth = st.size * 4.5;
  } else {
    c.strokeStyle = st.color;
    c.fillStyle = st.color;
    c.lineWidth = st.size;
  }

  if (pts.length === 1) {
    c.beginPath();
    if(st.shape === 'round') c.arc(pts.x, pts.y, c.lineWidth/2, 0, Math.PI*2);
    else c.rect(pts.x - c.lineWidth/2, pts.y - c.lineWidth/2, c.lineWidth, c.lineWidth);
    c.fill();
  } else {
    c.beginPath(); c.moveTo(pts.x, pts.y);
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i].x + pts[i+1].x) / 2;
      const my = (pts[i].y + pts[i+1].y) / 2;
      c.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
    }
    c.lineTo(pts[pts.length-1].x, pts[pts.length-1].y);
    c.stroke();
  }
  c.restore();
}

function hexA(hex, a) {
  if(!hex.startsWith('#')) return hex;
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ════════════════════════════════════════════════════════
// STROKE LOGIC & STABILIZATION
// ════════════════════════════════════════════════════════
function startStroke(e) {
  penDown = true;
  const { sx, sy } = evXY(e);
  const pt = s2c(sx, sy);
  lastPtRaw = pt; // For stabilizer
  cur = { tool, color, size, shape: penOpts.shape, pts: [pt] };
}

function continueStroke(e) {
  if (!penDown || !cur) return;
  const { sx, sy } = evXY(e);
  const targetPt = s2c(sx, sy);
  
  // Apply linear interpolation stabilizer
  const s = parseFloat(penOpts.stability);
  const finalX = (lastPtRaw.x * s) + (targetPt.x * (1 - s));
  const finalY = (lastPtRaw.y * s) + (targetPt.y * (1 - s));
  
  const finalPt = { x: finalX, y: finalY };
  cur.pts.push(finalPt);
  lastPtRaw = finalPt;
  
  draw();
}

function endStroke() {
  if (!penDown) return;
  penDown = false;
  if (cur?.pts.length) { strokes.push(cur); redos = []; }
  cur = null; lastPtRaw = null;
}

// ════════════════════════════════════════════════════════
// POINTER EVENTS
// ════════════════════════════════════════════════════════
cv.addEventListener('pointerdown', onDown, { passive: false });
cv.addEventListener('pointermove', onMove, { passive: false });
cv.addEventListener('pointerup', onUp, { passive: false });
cv.addEventListener('pointercancel', onUp, { passive: false });

function onDown(e) {
  e.preventDefault();
  closeMenus();
  ptrs.set(e.pointerId, { cx: e.clientX, cy: e.clientY, type: e.pointerType });
  if (e.pointerType === 'pen' || e.pointerType === 'mouse') {
    cv.setPointerCapture(e.pointerId);
    if (tool === 'select') startSel(e);
    else startStroke(e);
  } else if (e.pointerType === 'touch') {
    const tp = getTouches();
    if (tp.length === 1) { pan = { cx: e.clientX, cy: e.clientY, vx, vy }; inTouch = true; } 
    else if (tp.length === 2) {
      const [a, b] = tp;
      pinch = { dist: Math.hypot(a.cx-b.cx, a.cy-b.cy), vx, vy, vs, mx: (a.cx+b.cx)/2 - areaRect().left, my: (a.cy+b.cy)/2 - areaRect().top };
      inTouch = true;
    }
  }
}

function onMove(e) {
  e.preventDefault();
  ptrs.set(e.pointerId, { cx: e.clientX, cy: e.clientY, type: e.pointerType });
  if (e.pointerType === 'pen' || e.pointerType === 'mouse') {
    showCursor(e);
    if (tool === 'select' && selActive) updateSel(e);
    else if (penDown) continueStroke(e);
  } else if (e.pointerType === 'touch' && inTouch) {
    const tp = getTouches();
    if (tp.length === 1) {
      vx = pan.vx + (e.clientX - pan.cx); vy = pan.vy + (e.clientY - pan.cy); draw();
    } else if (tp.length >= 2) {
      const [a, b] = tp;
      const nv = Math.max(0.12, Math.min(12, pinch.vs * (Math.hypot(a.cx-b.cx, a.cy-b.cy) / pinch.dist)));
      const cmx = (a.cx+b.cx)/2 - areaRect().left, cmy = (a.cy+b.cy)/2 - areaRect().top;
      vs = nv; vx = cmx - ((pinch.mx - pinch.vx) / pinch.vs) * nv; vy = cmy - ((pinch.my - pinch.vy) / pinch.vs) * nv;
      draw();
    }
  }
}

function onUp(e) {
  e.preventDefault();
  if (e.pointerType === 'pen' || e.pointerType === 'mouse') {
    hideCursor();
    if (tool === 'select') finishSel(e);
    else endStroke();
  } else if (e.pointerType === 'touch') {
    inTouch = false; ptrs.delete(e.pointerId);
    const rem = getTouches();
    if (rem.length === 1) { pan = { cx: rem.cx, cy: rem.cy, vx, vy }; inTouch = true; }
    return;
  }
  ptrs.delete(e.pointerId);
}

function getTouches() { return [...ptrs.values()].filter(p => p.type === 'touch'); }

// Cursor Preview
function showCursor(e) {
  if (tool === 'select') return;
  const r = areaRect(), px = e.clientX, py = e.clientY;
  if (px < r.left || px > r.right || py < r.top || py > r.bottom) return;
  
  let d, bg, border;
  if (tool === 'eraser') { d = size * 2.5 * vs; bg = 'rgba(255,255,255,0.7)'; border = '1.5px solid #aaa'; } 
  else if (tool === 'highlighter') { d = size * 4.5 * vs; bg = hexA(color, 0.3); border = 'none'; } 
  else { d = size * vs; bg = color; border = 'none'; }
  d = Math.max(4, Math.min(80, d));
  
  cpEl.style.display = 'block'; cpEl.style.left = px + 'px'; cpEl.style.top = py + 'px';
  cpEl.style.width = d + 'px'; cpEl.style.height = d + 'px';
  cpEl.style.background = bg; cpEl.style.border = border;
  cpEl.style.borderRadius = penOpts.shape === 'round' ? '50%' : '0%';
}
function hideCursor() { cpEl.style.display = 'none'; }

// ════════════════════════════════════════════════════════
// SELECTION & CAPTURE LOGIC
// ════════════════════════════════════════════════════════
function startSel(e) {
  selActive = true; const r = areaRect();
  selStart = { x: e.clientX - r.left, y: e.clientY - r.top };
  selRect = null; captured = null; clearSel(); updateRgnBtn();
}
function updateSel(e) {
  if (!selActive) return;
  const r = areaRect(), cx = e.clientX - r.left, cy = e.clientY - r.top;
  const x = Math.min(selStart.x, cx), y = Math.min(selStart.y, cy);
  const w = Math.abs(cx - selStart.x), h = Math.abs(cy - selStart.y);
  selRect = { sx: x, sy: y, sw: w, sh: h };
  selEl.style.display = 'block';
  selEl.style.left = (r.left + x) + 'px'; selEl.style.top = (r.top + y) + 'px';
  selEl.style.width = w + 'px'; selEl.style.height = h + 'px';
}
function finishSel(e) {
  selActive = false;
  if (selRect && selRect.sw > 8 && selRect.sh > 8) {
    captured = captureRegion(selRect); updateRgnBtn();
    toast('Region selected — tap Analyze Region in AI panel');
  } else clearSel();
}
function clearSel() { selEl.style.display = 'none'; selRect = null; }

function getCompositeCanvas(rect = null) {
  const tmp = document.createElement('canvas');
  let sx = 0, sy = 0, sw = cv.width / dpr, sh = cv.height / dpr;
  
  if (rect) { sx = rect.sx; sy = rect.sy; sw = rect.sw; sh = rect.sh; }
  
  tmp.width = Math.round(sw); tmp.height = Math.round(sh);
  const tc = tmp.getContext('2d');
  
  // Draw Background layer then Ink layer
  tc.drawImage(bgCv, sx * dpr, sy * dpr, sw * dpr, sh * dpr, 0, 0, sw, sh);
  tc.drawImage(cv, sx * dpr, sy * dpr, sw * dpr, sh * dpr, 0, 0, sw, sh);
  return tmp;
}

function captureRegion(rect) { return getCompositeCanvas(rect).toDataURL('image/jpeg', 0.88).split(','); }
function captureFullPage() { return getCompositeCanvas().toDataURL('image/jpeg', 0.85).split(','); }
function updateRgnBtn() { document.getElementById('b-rgn').classList.toggle('rdy', !!captured); }

// ════════════════════════════════════════════════════════
// DOWNLOAD PDF
// ════════════════════════════════════════════════════════
document.getElementById('dl-btn').addEventListener('click', async () => {
  if (typeof window.jspdf === 'undefined') { toast('PDF library loading...'); return; }
  toast('Preparing PDF…');
  await new Promise(r => setTimeout(r, 80));

  try {
    const { jsPDF } = window.jspdf;
    const bounds = getPageBounds();
    let exportRect = null;
    
    // If bound size, export just the page bounds mapped through view matrix
    if (bounds) {
      exportRect = { sx: vx, sy: vy, sw: bounds.w * vs, sh: bounds.h * vs };
    }
    
    const comp = getCompositeCanvas(exportRect);
    const imgData = comp.toDataURL('image/jpeg', 0.95);
    
    const cw = comp.width; const ch = comp.height;
    const PX_TO_MM = 0.2646;
    const pdfW = Math.round(cw * PX_TO_MM);
    const pdfH = Math.round(ch * PX_TO_MM);

    const pdf = new jsPDF({ orientation: cw >= ch ? 'landscape' : 'portrait', unit: 'mm', format: [pdfW, pdfH], compress: true });
    pdf.addImage(imgData, 'JPEG', 0, 0, pdfW, pdfH, undefined, 'FAST');
    
    const stamp = new Date().toISOString().slice(0,10);
    pdf.save(`inkwell-notes-${stamp}.pdf`);
    toast('Notes downloaded as PDF');
  } catch (err) {
    console.error(err); toast('PDF export failed');
  }
});

// ════════════════════════════════════════════════════════
// UI EVENT LISTENERS
// ════════════════════════════════════════════════════════
document.getElementById('b-undo').addEventListener('click', () => { if(strokes.length) { redos.push(strokes.pop()); draw(); toast('Undo'); }});
document.getElementById('b-redo').addEventListener('click', () => { if(redos.length) { strokes.push(redos.pop()); draw(); toast('Redo'); }});
document.getElementById('b-clr').addEventListener('click', () => {
  if(!confirm('Clear the canvas?')) return;
  strokes=[]; redos=[]; cur=null; penDown=false; clearSel(); updateRgnBtn(); draw();
});

document.querySelectorAll('[data-tool]').forEach(btn => {
  btn.addEventListener('click', () => {
    tool = btn.dataset.tool;
    document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('on')); btn.classList.add('on');
    cv.style.cursor = tool === 'eraser' ? 'cell' : 'crosshair';
    if(tool === 'select') toast('Draw a rectangle to select region');
  });
});

document.querySelectorAll('.csw').forEach(sw => {
  sw.addEventListener('click', (e) => {
    if(e.target.id === 'custom-color') return; // let input handle it
    color = sw.dataset.color || document.getElementById('custom-color').value;
    document.querySelectorAll('.csw').forEach(s => s.classList.remove('on'));
    sw.classList.add('on');
    if(tool === 'eraser') document.querySelector('[data-tool="pen"]').click();
  });
});

document.getElementById('custom-color').addEventListener('input', (e) => {
  color = e.target.value;
  document.querySelectorAll('.csw').forEach(s => s.classList.remove('on'));
  document.getElementById('custom-csw').classList.add('on');
  if(tool === 'eraser') document.querySelector('[data-tool="pen"]').click();
});

// Size Buttons
const szEl = document.getElementById('sz');
const szVal = document.getElementById('sz-val');
function updateSize(v) { size = v; szEl.value = v; szVal.textContent = v; }
szEl.addEventListener('input', e => updateSize(+e.target.value));
document.getElementById('sz-dec').addEventListener('click', () => updateSize(Math.max(1, size-1)));
document.getElementById('sz-inc').addEventListener('click', () => updateSize(Math.min(24, size+1)));

// Popovers
function closeMenus() { document.querySelectorAll('.popover').forEach(p => p.classList.remove('show')); }
document.getElementById('b-pen-settings').addEventListener('click', (e) => { e.stopPropagation(); closeMenus(); document.getElementById('pen-menu').classList.toggle('show'); });
document.getElementById('b-page-settings').addEventListener('click', (e) => { e.stopPropagation(); closeMenus(); document.getElementById('page-menu').classList.toggle('show'); });
area.addEventListener('click', closeMenus);

// Pen Options
document.getElementById('pen-shape').addEventListener('change', e => penOpts.shape = e.target.value);
document.getElementById('pen-stability').addEventListener('input', e => penOpts.stability = parseFloat(e.target.value));

// Page Options
document.getElementById('page-size').addEventListener('change', e => { pageOpts.size = e.target.value; vx=0; vy=0; vs=1; draw(); });
document.getElementById('page-pattern').addEventListener('change', e => { pageOpts.pattern = e.target.value; draw(); });
document.getElementById('page-color-pick').addEventListener('input', e => { pageOpts.color = e.target.value; draw(); });

// Wheel Pan/Zoom
area.addEventListener('wheel', e => {
  e.preventDefault(); const r = areaRect(), cx = e.clientX - r.left, cy = e.clientY - r.top;
  if(e.ctrlKey) {
    const nv = Math.max(0.12, Math.min(12, vs * (e.deltaY < 0 ? 1.12 : 1/1.12)));
    vx = cx - (cx - vx) * (nv / vs); vy = cy - (cy - vy) * (nv / vs); vs = nv;
  } else { vx -= e.deltaX; vy -= e.deltaY; }
  draw();
}, { passive: false });

// ════════════════════════════════════════════════════════
// AI ASSISTANT
// ════════════════════════════════════════════════════════
let groqKey = localStorage.getItem('inkwell_key') || '';
if(groqKey) document.getElementById('ki').value = groqKey;

document.getElementById('ai-btn').addEventListener('click', () => document.getElementById('panel').classList.add('open'));
document.getElementById('cls').addEventListener('click', () => document.getElementById('panel').classList.remove('open'));
document.getElementById('ks-btn').addEventListener('click', () => {
  groqKey = document.getElementById('ki').value.trim(); localStorage.setItem('inkwell_key', groqKey); toast('API key saved');
});

document.getElementById('b-page').addEventListener('click', () => askAI('Summarize the contents of this page.', captureFullPage()));
document.getElementById('b-rgn').addEventListener('click', () => {
  if(!captured) { document.querySelector('[data-tool="select"]').click(); return; }
  askAI('Explain what is written or drawn in this selected region.', captured);
  captured = null; clearSel(); updateRgnBtn();
});

document.getElementById('sb').addEventListener('click', sendChat);
document.getElementById('ci').addEventListener('keydown', e => { if(e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }});
function sendChat() { const inp = document.getElementById('ci'); const msg = inp.value.trim(); if(!msg) return; inp.value = ''; askAI(msg, null); }

async function askAI(userMsg, imgB64) {
  if(!groqKey) return toast('Enter Groq API key first');
  const msgs = document.getElementById('msgs');
  msgs.innerHTML += `<div class="bub u">${userMsg}</div>`;
  msgs.scrollTop = msgs.scrollHeight;

  const tyEl = document.createElement('div');
  tyEl.className = 'bub a'; tyEl.textContent = 'Thinking...';
  msgs.appendChild(tyEl); msgs.scrollTop = msgs.scrollHeight;

  const content = imgB64 ? [ {type:'image_url', image_url:{url:`data:image/jpeg;base64,${imgB64}`}}, {type:'text', text:userMsg} ] : userMsg;
  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${groqKey}` },
      body: JSON.stringify({
        model: document.getElementById('ms').value,
        messages: [{role:'system', content:'You are a note-taking AI assistant.'}, {role:'user', content}],
        max_tokens: 1024
      })
    });
    const data = await res.json();
    tyEl.textContent = res.ok ? data.choices.message.content : `Error: ${data.error?.message}`;
    if(!res.ok) tyEl.classList.replace('a','e');
  } catch(e) { tyEl.textContent = 'Network Error'; tyEl.classList.replace('a','e'); }
}

let toastT;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}
</script>
