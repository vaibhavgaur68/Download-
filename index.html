<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PULSE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="canvas"></canvas>

  <!-- ── TERMINAL BOOT OVERLAY ── -->
  <div id="terminal-overlay">
    <div id="terminal-inner">
      <div id="terminal-text"></div>
      <span id="terminal-cursor">▮</span>
    </div>
  </div>

  <!-- HUD overlay -->
  <div id="hud" class="hidden">
    <div id="hud-score">0</div>
    <div id="hud-combo" class="hidden">×<span id="combo-val">2</span></div>
    <div id="hud-best">BEST<br><span id="best-val">0</span></div>
  </div>

  <!-- Lives — horizontal, top-left, pixel hearts -->
  <div id="lives-hud" class="hidden">
    <span id="life-0" class="life-heart"></span>
    <span id="life-1" class="life-heart"></span>
    <span id="life-2" class="life-heart"></span>
  </div>

  <!-- Level path map (right side, vertical) -->
  <div id="level-map" class="hidden"></div>

  <!-- Start screen -->
  <div id="start-screen" class="screen-hidden">
    <div class="screen-card">
      <div class="alien-sigil">◈</div>
      <div class="game-title">PULSE</div>
      <div class="game-tagline">HUMAN TESTING INITIATED.</div>
      <div class="ring-demo" id="ring-demo"></div>
      <button class="btn" id="start-btn">SUBMIT TO TEST</button>
      <div class="key-hint">SPACE · CLICK · TAP</div>
    </div>
  </div>

  <!-- Game over screen — Alien Verdict -->
  <div id="gameover-screen" class="screen-hidden">
    <div class="verdict-frame">
      <div class="verdict-header">
        <span class="verdict-icon">⚠</span>
        <span class="verdict-title">ALIEN VERDICT</span>
        <span class="verdict-icon">⚠</span>
      </div>
      <div class="verdict-row">
        <div class="go-label">BRAIN SPEED</div>
        <div id="final-score" class="go-score">0</div>
        <div id="new-hs-badge" class="new-hs hidden">★ NEW BEST ★</div>
      </div>
      <div class="verdict-divider"></div>
      <div class="verdict-row">
        <div class="go-label">BEST</div>
        <div id="final-best" class="go-best">0</div>
      </div>
      <div class="verdict-divider"></div>
      <div class="verdict-row">
        <div class="go-label">YOUR NEW RANK</div>
        <div id="final-level" class="go-level">VOID</div>
      </div>
      <div class="verdict-divider"></div>
      <div id="fate-block">
        <div class="go-label">ASSIGNED FATE</div>
        <div id="fate-text" class="fate-text"></div>
      </div>
      <button class="btn btn-danger" id="retry-btn">REQUEST RETEST</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
