<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STARK INTEL — Threat Assessment Board</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=IBM+Plex+Mono:wght@300;400;600&display=swap');

  :root {
    --bg: #050a0f;
    --surface: rgba(5, 18, 30, 0.85);
    --border: rgba(0, 200, 255, 0.2);
    --gold: #d4a017;
    --gold-bright: #ffcc00;
    --cyan: #00c8ff;
    --cyan-dim: rgba(0,200,255,0.15);
    --red: #ff3b30;
    --red-dim: rgba(255,59,48,0.15);
    --orange: #ff8c00;
    --green: #00e676;
    --text: #9ecfdf;
    --text-muted: #3a6070;
    --text-bright: #e0f4ff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid BG */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,200,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,200,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  /* Scanlines */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 3px,
      rgba(0,200,255,0.012) 3px, rgba(0,200,255,0.012) 4px
    );
    pointer-events: none;
    z-index: 999;
  }

  /* ── HEADER ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 28px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(5,10,15,0.95);
    backdrop-filter: blur(12px);
    z-index: 100;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .si-badge {
    background: var(--gold);
    color: #000;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.55rem;
    font-weight: 900;
    letter-spacing: 3px;
    padding: 5px 10px;
    text-transform: uppercase;
  }

  .header-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--text-bright);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .header-subtitle {
    font-size: 0.6rem;
    color: var(--text-muted);
    letter-spacing: 2px;
    margin-top: 2px;
    text-transform: uppercase;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .threat-index {
    text-align: right;
  }

  .threat-index-val {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.6rem;
    font-weight: 900;
    line-height: 1;
  }

  .threat-index-label {
    font-size: 0.55rem;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .global-timer {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    color: var(--cyan);
    letter-spacing: 2px;
    border: 1px solid var(--border);
    padding: 6px 12px;
  }

  .add-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    border: 1px solid var(--cyan);
    background: var(--cyan-dim);
    color: var(--cyan);
    padding: 8px 16px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .add-btn:hover {
    background: rgba(0,200,255,0.25);
    box-shadow: 0 0 12px rgba(0,200,255,0.3);
  }

  /* ── STATS BAR ── */
  .stats-bar {
    display: flex;
    gap: 0;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }

  .stat-cell {
    flex: 1;
    padding: 10px 20px;
    border-right: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 120px;
  }

  .stat-cell:last-child { border-right: none; }

  .stat-icon {
    width: 8px; height: 8px;
    border-radius: 50%;
  }

  .stat-cell .val {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
  }

  .stat-cell .lbl {
    font-size: 0.55rem;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* ── BOARD ── */
  .board {
    display: flex;
    gap: 0;
    padding: 0;
    height: calc(100vh - 130px);
    overflow: hidden;
  }

  /* ── COLUMN ── */
  .col {
    flex: 1;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    min-width: 220px;
    overflow: hidden;
  }

  .col:last-child { border-right: none; }

  .col-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }

  .col-header::before {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
  }

  .col[data-status="identified"] .col-header::before { background: var(--cyan); }
  .col[data-status="assessing"] .col-header::before { background: var(--orange); }
  .col[data-status="active"] .col-header::before { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .col[data-status="neutralized"] .col-header::before { background: var(--green); }

  .col-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .col[data-status="identified"] .col-title { color: var(--cyan); }
  .col[data-status="assessing"] .col-title { color: var(--orange); }
  .col[data-status="active"] .col-title { color: var(--red); }
  .col[data-status="neutralized"] .col-title { color: var(--green); }

  .col-count {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid;
  }

  .col[data-status="identified"] .col-count { border-color: var(--cyan); color: var(--cyan); }
  .col[data-status="assessing"] .col-count { border-color: var(--orange); color: var(--orange); }
  .col[data-status="active"] .col-count { border-color: var(--red); color: var(--red); }
  .col[data-status="neutralized"] .col-count { border-color: var(--green); color: var(--green); }

  .cards-area {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .cards-area::-webkit-scrollbar { width: 4px; }
  .cards-area::-webkit-scrollbar-track { background: transparent; }
  .cards-area::-webkit-scrollbar-thumb { background: var(--border); }

  /* ── CARD ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 12px 14px;
    cursor: grab;
    position: relative;
    transition: all 0.15s;
    backdrop-filter: blur(6px);
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
  }

  .card[data-level="critical"]::before { background: var(--red); box-shadow: 2px 0 8px var(--red); }
  .card[data-level="high"]::before { background: var(--orange); }
  .card[data-level="medium"]::before { background: var(--gold-bright); }
  .card[data-level="low"]::before { background: var(--green); }

  .card:hover {
    border-color: rgba(0,200,255,0.5);
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(0,200,255,0.1);
  }

  .card:active { cursor: grabbing; }

  .card.dragging {
    opacity: 0.4;
    transform: scale(0.97);
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }

  .card-id {
    font-size: 0.55rem;
    color: var(--text-muted);
    letter-spacing: 2px;
  }

  .card-level {
    font-size: 0.5rem;
    letter-spacing: 2px;
    padding: 2px 7px;
    border: 1px solid;
    text-transform: uppercase;
    font-weight: 600;
  }

  .card[data-level="critical"] .card-level { border-color: var(--red); color: var(--red); background: rgba(255,59,48,0.1); }
  .card[data-level="high"] .card-level { border-color: var(--orange); color: var(--orange); background: rgba(255,140,0,0.1); }
  .card[data-level="medium"] .card-level { border-color: var(--gold-bright); color: var(--gold-bright); background: rgba(255,204,0,0.08); }
  .card[data-level="low"] .card-level { border-color: var(--green); color: var(--green); background: rgba(0,230,118,0.08); }

  .card-title {
    font-size: 0.75rem;
    color: var(--text-bright);
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    line-height: 1.4;
  }

  .card-desc {
    font-size: 0.6rem;
    color: var(--text);
    line-height: 1.5;
    margin-bottom: 10px;
    opacity: 0.7;
  }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }

  .card-tags {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }

  .card-tag {
    font-size: 0.48rem;
    letter-spacing: 1px;
    padding: 2px 5px;
    background: rgba(0,200,255,0.06);
    border: 1px solid rgba(0,200,255,0.15);
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .card-meta {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .card-time {
    font-size: 0.55rem;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  .move-btns {
    display: flex;
    gap: 4px;
  }

  .move-btn {
    font-size: 0.55rem;
    padding: 3px 6px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'IBM Plex Mono', monospace;
  }

  .move-btn:hover {
    border-color: var(--cyan);
    color: var(--cyan);
    background: var(--cyan-dim);
  }

  /* ── DROP ZONE ── */
  .cards-area.drag-over {
    background: rgba(0,200,255,0.04);
    border: 1px dashed rgba(0,200,255,0.3);
  }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(4px);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: #060f18;
    border: 1px solid var(--border);
    width: 100%;
    max-width: 480px;
    padding: 28px;
    position: relative;
  }

  .modal::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--cyan), var(--gold), var(--red));
  }

  .modal-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--text-bright);
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .form-group {
    margin-bottom: 14px;
  }

  .form-label {
    font-size: 0.6rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    display: block;
    margin-bottom: 6px;
  }

  .form-input, .form-select, .form-textarea {
    width: 100%;
    background: rgba(0,200,255,0.04);
    border: 1px solid var(--border);
    color: var(--text-bright);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    padding: 8px 12px;
    outline: none;
    transition: border-color 0.2s;
  }

  .form-input:focus, .form-select:focus, .form-textarea:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 8px rgba(0,200,255,0.15);
  }

  .form-textarea { resize: vertical; min-height: 70px; }
  .form-select option { background: #060f18; color: var(--text-bright); }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  .btn-primary {
    flex: 1;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: var(--cyan-dim);
    border: 1px solid var(--cyan);
    color: var(--cyan);
    padding: 10px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-primary:hover {
    background: rgba(0,200,255,0.25);
    box-shadow: 0 0 12px rgba(0,200,255,0.3);
  }

  .btn-cancel {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 10px 20px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-cancel:hover { border-color: var(--text-muted); color: var(--text); }

  /* pulse on active col */
  .col[data-status="active"] .col-header {
    animation: colPulse 2s ease-in-out infinite;
  }

  @keyframes colPulse {
    0%,100% { background: transparent; }
    50% { background: rgba(255,59,48,0.05); }
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <div class="si-badge">SI</div>
    <div>
      <div class="header-title">Threat Assessment Board</div>
      <div class="header-subtitle">JARVIS Strategic Intelligence · Clearance: Level 5</div>
    </div>
  </div>
  <div class="header-right">
    <div class="threat-index">
      <div class="threat-index-val" id="globalThreat" style="color:var(--red)">—</div>
      <div class="threat-index-label">Global Threat Index</div>
    </div>
    <div class="global-timer" id="liveTime">--:--:--</div>
    <button class="add-btn" onclick="openModal()">+ New Threat</button>
  </div>
</div>

<!-- STATS BAR -->
<div class="stats-bar" id="statsBar">
  <div class="stat-cell">
    <div class="stat-icon" style="background:var(--red); box-shadow:0 0 6px var(--red)"></div>
    <div><div class="val" id="statCritical" style="color:var(--red)">0</div><div class="lbl">Critical</div></div>
  </div>
  <div class="stat-cell">
    <div class="stat-icon" style="background:var(--orange)"></div>
    <div><div class="val" id="statHigh" style="color:var(--orange)">0</div><div class="lbl">High</div></div>
  </div>
  <div class="stat-cell">
    <div class="stat-icon" style="background:var(--gold-bright)"></div>
    <div><div class="val" id="statMedium" style="color:var(--gold-bright)">0</div><div class="lbl">Medium</div></div>
  </div>
  <div class="stat-cell">
    <div class="stat-icon" style="background:var(--green)"></div>
    <div><div class="val" id="statLow" style="color:var(--green)">0</div><div class="lbl">Low</div></div>
  </div>
  <div class="stat-cell">
    <div class="stat-icon" style="background:var(--cyan)"></div>
    <div><div class="val" id="statTotal" style="color:var(--cyan)">0</div><div class="lbl">Total Active</div></div>
  </div>
  <div class="stat-cell">
    <div class="stat-icon" style="background:var(--text-muted)"></div>
    <div><div class="val" id="statNeutralized" style="color:var(--green)">0</div><div class="lbl">Neutralized</div></div>
  </div>
</div>

<!-- BOARD -->
<div class="board" id="board">
  <div class="col" data-status="identified">
    <div class="col-header">
      <div class="col-title">Identified</div>
      <div class="col-count" id="cnt-identified">0</div>
    </div>
    <div class="cards-area" id="zone-identified"></div>
  </div>
  <div class="col" data-status="assessing">
    <div class="col-header">
      <div class="col-title">Assessing</div>
      <div class="col-count" id="cnt-assessing">0</div>
    </div>
    <div class="cards-area" id="zone-assessing"></div>
  </div>
  <div class="col" data-status="active">
    <div class="col-header">
      <div class="col-title">Active Threat</div>
      <div class="col-count" id="cnt-active">0</div>
    </div>
    <div class="cards-area" id="zone-active"></div>
  </div>
  <div class="col" data-status="neutralized">
    <div class="col-header">
      <div class="col-title">Neutralized</div>
      <div class="col-count" id="cnt-neutralized">0</div>
    </div>
    <div class="cards-area" id="zone-neutralized"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-title">▶ Log New Threat</div>
    <div class="form-group">
      <label class="form-label">Threat Name / Designation</label>
      <input class="form-input" id="fTitle" type="text" placeholder="e.g. Hydra Strike Team Alpha" autocomplete="off"/>
    </div>
    <div class="form-group">
      <label class="form-label">Intel Summary</label>
      <textarea class="form-textarea" id="fDesc" placeholder="Describe the threat origin, capability, and known intel..."></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Threat Level</label>
        <select class="form-select" id="fLevel">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high" selected>High</option>
          <option value="critical">Critical</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Initial Status</label>
        <select class="form-select" id="fStatus">
          <option value="identified" selected>Identified</option>
          <option value="assessing">Assessing</option>
          <option value="active">Active Threat</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Tags (comma separated)</label>
      <input class="form-input" id="fTags" type="text" placeholder="e.g. HYDRA, NYC, armed" autocomplete="off"/>
    </div>
    <div class="modal-actions">
      <button class="btn-primary" onclick="addThreat()">Log Threat</button>
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
  // ── CLOCK ──
  function tick() {
    document.getElementById('liveTime').textContent = new Date().toTimeString().slice(0,8);
  }
  setInterval(tick, 1000); tick();

  // ── DATA ──
  const statuses = ['identified','assessing','active','neutralized'];
  let threats = [
    { id:'TH-001', title:'Unknown Aerial Contact', desc:'Unregistered aircraft detected approaching Stark Tower perimeter. Transponder signal masked.', level:'critical', status:'active', tags:['AIR','NYC'], time: timeAgo(2) },
    { id:'TH-002', title:'Hydra Data Breach Attempt', desc:'Repeated intrusion attempts on JARVIS secondary server. Origin traced to Eastern Europe.', level:'high', status:'assessing', tags:['CYBER','HYDRA'], time: timeAgo(15) },
    { id:'TH-003', title:'AIM Research Compound', desc:'Satellite imagery shows unusual energy signature from AIM lab, Mojave sector.', level:'high', status:'identified', tags:['AIM','SCIENCE'], time: timeAgo(40) },
    { id:'TH-004', title:'Missing Stark Shipment', desc:'Container ship carrying prototype components failed scheduled check-in. Last ping: Atlantic.', level:'medium', status:'assessing', tags:['LOGISTICS'], time: timeAgo(90) },
    { id:'TH-005', title:'Agent Brown — Compromised', desc:'Field operative Brown last reported infiltrating Ten Rings cell. Radio silence for 18 hours.', level:'medium', status:'identified', tags:['SHIELD','TEN RINGS'], time: timeAgo(120) },
    { id:'TH-006', title:'Rogue Mark IV Sighting', desc:'Repulsor signature consistent with stolen Mark IV armor detected in Zurich financial district.', level:'critical', status:'identified', tags:['ARMOR','EUROPE'], time: timeAgo(5) },
    { id:'TH-007', title:'Port Authority Bribed Officials', desc:'Two harbor inspectors placed on watch list following irregular container approvals.', level:'low', status:'identified', tags:['CORRUPTION'], time: timeAgo(200) },
    { id:'TH-008', title:'Palladium Ring Operation', desc:'Attempted palladium theft thwarted. Three operatives apprehended; network still active.', level:'medium', status:'neutralized', tags:['RESOURCES'], time: timeAgo(360) },
    { id:'TH-009', title:'Mandarin Broadcast Intercept', desc:'Encrypted broadcast matching Mandarin signature intercepted via comms array. Content decoded.', level:'high', status:'neutralized', tags:['MANDARIN','INTEL'], time: timeAgo(500) },
  ];

  let dragId = null;

  function timeAgo(minsAgo) {
    const d = new Date(Date.now() - minsAgo * 60000);
    return d.toTimeString().slice(0,5);
  }

  // ── RENDER ──
  function render() {
    statuses.forEach(st => {
      const zone = document.getElementById('zone-' + st);
      const items = threats.filter(t => t.status === st);
      document.getElementById('cnt-' + st).textContent = items.length;
      zone.innerHTML = '';
      items.forEach(t => {
        zone.appendChild(buildCard(t));
      });
    });
    updateStats();
    setupDrop();
  }

  function buildCard(t) {
    const div = document.createElement('div');
    div.className = 'card';
    div.setAttribute('data-level', t.level);
    div.setAttribute('data-id', t.id);
    div.draggable = true;

    const nextStIdx = statuses.indexOf(t.status) + 1;
    const prevStIdx = statuses.indexOf(t.status) - 1;
    const nextLabel = nextStIdx < statuses.length ? '→' : '';
    const prevLabel = prevStIdx >= 0 ? '←' : '';

    div.innerHTML = `
      <div class="card-top">
        <span class="card-id">${t.id}</span>
        <span class="card-level">${t.level}</span>
      </div>
      <div class="card-title">${t.title}</div>
      <div class="card-desc">${t.desc}</div>
      <div class="card-footer">
        <div class="card-tags">${t.tags.map(tg => `<span class="card-tag">${tg}</span>`).join('')}</div>
        <div class="card-meta">
          <span class="card-time">${t.time}</span>
          <div class="move-btns">
            ${prevLabel ? `<button class="move-btn" onclick="moveCard('${t.id}',-1)">${prevLabel}</button>` : ''}
            ${nextLabel ? `<button class="move-btn" onclick="moveCard('${t.id}',1)">${nextLabel}</button>` : ''}
          </div>
        </div>
      </div>
    `;

    div.addEventListener('dragstart', () => {
      dragId = t.id;
      setTimeout(() => div.classList.add('dragging'), 0);
    });
    div.addEventListener('dragend', () => {
      div.classList.remove('dragging');
      dragId = null;
    });
    return div;
  }

  function setupDrop() {
    document.querySelectorAll('.cards-area').forEach(zone => {
      zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
      zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
      zone.addEventListener('drop', e => {
        e.preventDefault();
        zone.classList.remove('drag-over');
        const colEl = zone.closest('.col');
        const newStatus = colEl.getAttribute('data-status');
        if (dragId) {
          const t = threats.find(x => x.id === dragId);
          if (t) { t.status = newStatus; render(); }
        }
      });
    });
  }

  function moveCard(id, dir) {
    const t = threats.find(x => x.id === id);
    if (!t) return;
    const idx = statuses.indexOf(t.status);
    const newIdx = idx + dir;
    if (newIdx >= 0 && newIdx < statuses.length) {
      t.status = statuses[newIdx];
      render();
    }
  }

  function updateStats() {
    const active = threats.filter(t => t.status !== 'neutralized');
    document.getElementById('statCritical').textContent = threats.filter(t => t.level === 'critical' && t.status !== 'neutralized').length;
    document.getElementById('statHigh').textContent = threats.filter(t => t.level === 'high' && t.status !== 'neutralized').length;
    document.getElementById('statMedium').textContent = threats.filter(t => t.level === 'medium' && t.status !== 'neutralized').length;
    document.getElementById('statLow').textContent = threats.filter(t => t.level === 'low' && t.status !== 'neutralized').length;
    document.getElementById('statTotal').textContent = active.length;
    document.getElementById('statNeutralized').textContent = threats.filter(t => t.status === 'neutralized').length;

    // Global threat index (weighted)
    const weights = { critical: 4, high: 3, medium: 2, low: 1 };
    const score = active.reduce((s, t) => s + (weights[t.level] || 1), 0);
    const el = document.getElementById('globalThreat');
    el.textContent = score;
    el.style.color = score >= 20 ? 'var(--red)' : score >= 12 ? 'var(--orange)' : score >= 6 ? 'var(--gold-bright)' : 'var(--green)';
  }

  // ── MODAL ──
  let idCounter = 10;
  function openModal() {
    document.getElementById('modalOverlay').classList.add('open');
    document.getElementById('fTitle').focus();
  }
  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    ['fTitle','fDesc','fTags'].forEach(id => document.getElementById(id).value = '');
  }
  function addThreat() {
    const title = document.getElementById('fTitle').value.trim();
    if (!title) { document.getElementById('fTitle').style.borderColor='var(--red)'; return; }
    document.getElementById('fTitle').style.borderColor='';
    const tags = document.getElementById('fTags').value.split(',').map(t=>t.trim().toUpperCase()).filter(Boolean);
    threats.unshift({
      id: 'TH-' + String(idCounter++).padStart(3,'0'),
      title,
      desc: document.getElementById('fDesc').value.trim() || 'Threat logged. Awaiting full intelligence report.',
      level: document.getElementById('fLevel').value,
      status: document.getElementById('fStatus').value,
      tags: tags.length ? tags : ['UNTAGGED'],
      time: new Date().toTimeString().slice(0,5),
    });
    closeModal();
    render();
  }

  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  render();
</script>
</body>
</html>
