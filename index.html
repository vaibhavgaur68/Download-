<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Inkwell — Smart Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --paper:   #FDFBF7;
  --ink:     #1B1D2E;
  --chrome:  #1B1D2E;
  --chrome2: #252738;
  --blue:    #4361EE;
  --purple:  #7C3AED;
  --red:     #EF4444;
  --amber:   #F59E0B;
  --green:   #22C55E;
  --muted:   #8B8C9E;
  --border:  #EBEBF0;
  --th: 58px;
  --pw: 360px;
}

html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--paper);
  font-family: 'DM Sans', system-ui, sans-serif;
  color: var(--ink);
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
}

/* ── TOOLBAR ─────────────────────────────────── */
#toolbar {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--th);
  background: var(--chrome);
  display: flex; align-items: center;
  padding: 0 10px; gap: 3px;
  z-index: 200;
  box-shadow: 0 1px 0 rgba(255,255,255,0.05), 0 4px 20px rgba(0,0,0,0.25);
}

.logo {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: 17px; font-weight: 600;
  color: white; letter-spacing: -0.3px;
  padding: 0 6px 0 2px; white-space: nowrap; flex-shrink: 0;
  display: flex; align-items: center; gap: 7px;
}

.sep {
  width: 1px; height: 20px;
  background: rgba(255,255,255,0.12);
  margin: 0 2px; flex-shrink: 0;
}

.tb {
  width: 34px; height: 34px; border-radius: 8px;
  border: none; background: transparent;
  color: rgba(255,255,255,0.55);
  cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  position: relative; flex-shrink: 0;
  transition: background .15s, color .15s;
  font-family: inherit;
}
.tb:hover { background: rgba(255,255,255,0.1); color: white; }
.tb.on { background: rgba(255,255,255,0.14); color: white; }
.tb.on::after {
  content: ''; position: absolute;
  bottom: 3px; left: 50%; transform: translateX(-50%);
  width: 14px; height: 2.5px; border-radius: 2px;
  background: var(--blue);
}
[data-tool="select"].on::after,
[data-tool="lasso"].on::after  { background: var(--purple); }
[data-tool="highlighter"].on::after { background: var(--amber); }
[data-tool="eraser"].on::after { background: var(--muted); }
#b-shapes.on::after            { background: var(--green); }

.spacer { flex: 1; }

/* Colors */
#colors { display: flex; gap: 5px; align-items: center; flex-shrink: 0; }
.csw {
  width: 19px; height: 19px; border-radius: 50%;
  cursor: pointer; border: 2.5px solid transparent;
  transition: transform .15s, border-color .15s; flex-shrink: 0;
}
.csw:hover { transform: scale(1.2); }
.csw.on { border-color: white; transform: scale(1.1); }

/* Size */
#sz-wrap { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.sz-lbl { font-size: 10px; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: .5px; }
#sz { width: 70px; accent-color: var(--blue); }

/* AI Button */
#ai-btn {
  display: flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 13px; border-radius: 8px;
  border: none;
  background: linear-gradient(135deg, #7C3AED 0%, #4361EE 100%);
  color: white; font-size: 12.5px; font-weight: 600;
  font-family: inherit; cursor: pointer; white-space: nowrap;
  flex-shrink: 0; transition: opacity .15s, transform .1s;
}
#ai-btn:hover { opacity: .88; }
#ai-btn:active { transform: scale(.97); }

/* Download PDF Button */
#dl-btn {
  display: flex; align-items: center; gap: 5px;
  height: 32px; padding: 0 11px; border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.18);
  background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.75); font-size: 12px; font-weight: 500;
  font-family: inherit; cursor: pointer; white-space: nowrap;
  flex-shrink: 0; transition: background .15s, color .15s, border-color .15s;
}
#dl-btn:hover { background: rgba(255,255,255,0.15); color: white; border-color: rgba(255,255,255,0.3); }
#dl-btn:active { transform: scale(.97); }
#dl-btn.loading { opacity: .6; pointer-events: none; }

/* ── SHAPES POPOVER ───────────────────────────── */
#shapes-pop {
  position: fixed;
  background: var(--chrome2);
  border-radius: 12px;
  padding: 6px;
  display: none;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  z-index: 250;
  box-shadow: 0 8px 30px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.07);
}
#shapes-pop.open { display: grid; }

.shape-opt {
  width: 46px; height: 46px;
  border: none; background: transparent;
  color: rgba(255,255,255,0.6);
  border-radius: 8px; cursor: pointer;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 3px; font-size: 9px; font-weight: 500;
  letter-spacing: .3px;
  transition: background .15s, color .15s;
  font-family: inherit; text-transform: uppercase;
}
.shape-opt:hover { background: rgba(255,255,255,0.1); color: white; }
.shape-opt.on {
  background: rgba(34,197,94,0.18);
  color: var(--green);
}

/* ── OBJECT CONTEXT BAR ──────────────────────── */
#obj-ctx-bar {
  position: fixed;
  display: none;
  align-items: center;
  gap: 2px;
  background: var(--chrome2);
  border-radius: 9px;
  padding: 4px;
  z-index: 180;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.07);
  pointer-events: all;
  transform: translateX(-50%);
}
.ctx-btn {
  width: 30px; height: 30px;
  border: none; background: transparent;
  color: rgba(255,255,255,0.65);
  border-radius: 6px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .15s, color .15s;
}
.ctx-btn:hover { background: rgba(255,255,255,0.1); color: white; }
.ctx-btn.danger:hover { background: rgba(239,68,68,0.2); color: var(--red); }
.ctx-sep {
  width: 1px; height: 18px;
  background: rgba(255,255,255,0.1);
  margin: 0 1px;
}

/* ── CANVAS AREA ──────────────────────────────── */
#area {
  position: fixed; top: var(--th); left: 0; right: 0; bottom: 0;
  overflow: hidden; background: var(--paper);
}
#cv {
  position: absolute; top: 0; left: 0;
  touch-action: none; cursor: crosshair; display: block;
}

/* ── SELECTION BOX (AI region) ────────────────── */
#sel {
  position: fixed;
  border: 2px dashed var(--purple);
  background: rgba(124,58,237,0.07);
  pointer-events: none; z-index: 100;
  display: none; border-radius: 4px;
  box-shadow: 0 0 0 1px rgba(124,58,237,0.15);
}

/* ── AI PANEL ─────────────────────────────────── */
#panel {
  position: fixed; top: var(--th); right: 0;
  width: var(--pw); bottom: 0;
  background: #FEFEFE;
  box-shadow: -2px 0 28px rgba(0,0,0,0.1);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  transform: translateX(100%);
  transition: transform .28s cubic-bezier(.4,0,.2,1);
  z-index: 150;
}
#panel.open { transform: translateX(0); }

/* Panel Header */
#ph {
  padding: 13px 14px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  background: white;
}
.ph-icon { display: flex; align-items: center; color: var(--purple); }
.pt { font-size: 14px; font-weight: 600; flex: 1; }
#cls {
  width: 26px; height: 26px; border-radius: 6px;
  border: none; background: #F0F0F4; cursor: pointer;
  color: var(--muted);
  display: flex; align-items: center; justify-content: center;
}
#cls:hover { background: #E4E4EC; }

/* API Key */
#ks {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  background: #FAFAFA;
}
.sl {
  font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .6px;
  color: var(--muted); margin-bottom: 6px;
}
.kr { display: flex; gap: 6px; }
#ki {
  flex: 1; height: 33px; padding: 0 10px;
  border: 1.5px solid var(--border); border-radius: 8px;
  font-size: 12px; font-family: 'Courier New', monospace;
  color: var(--ink); background: white; outline: none;
  -webkit-user-select: text; user-select: text;
}
#ki:focus { border-color: var(--blue); }
#ks-btn {
  height: 33px; padding: 0 12px; border-radius: 8px;
  border: none; background: var(--blue); color: white;
  font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer;
}
#ks-btn:hover { opacity: .9; }

/* Model Row */
#mr {
  padding: 8px 14px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.sli { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); white-space: nowrap; }
#ms {
  flex: 1; height: 29px; border: 1.5px solid var(--border);
  border-radius: 6px; font-size: 11.5px; font-family: inherit;
  color: var(--ink); background: white; padding: 0 6px; outline: none;
}
#ms:focus { border-color: var(--blue); }

/* Quick Actions */
#qa {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  display: flex; gap: 8px;
}
.qb {
  flex: 1; padding: 9px 6px; border-radius: 10px;
  border: 1.5px solid var(--border); background: white;
  font-size: 11.5px; font-weight: 500; font-family: inherit;
  color: var(--ink); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  transition: all .15s; line-height: 1.2;
}
.qb .qi {
  display: flex; align-items: center; justify-content: center;
  color: var(--muted);
}
.qb .qi svg { width: 20px; height: 20px; transition: color .15s; }
.qb:hover { border-color: var(--blue); color: var(--blue); }
.qb:hover .qi { color: var(--blue); }
.qb.rdy { border-color: var(--purple); color: var(--purple); background: #F9F5FF; }
.qb.rdy .qi { color: var(--purple); }

/* Chat */
#msgs {
  flex: 1; overflow-y: auto;
  padding: 12px 12px;
  display: flex; flex-direction: column; gap: 9px;
  scroll-behavior: smooth;
}
.empty-hint {
  color: var(--muted); font-size: 13px;
  text-align: center; padding-top: 28px;
  line-height: 1.6;
}
.empty-hint .hint-icon {
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 10px; color: var(--purple);
}

.bub {
  max-width: 90%; font-size: 13px; line-height: 1.56;
  padding: 9px 13px; border-radius: 14px; word-break: break-word;
}
.bub.u { align-self: flex-end; background: var(--blue); color: white; border-bottom-right-radius: 4px; }
.bub.a { align-self: flex-start; background: #F2F2F6; color: var(--ink); border-bottom-left-radius: 4px; white-space: pre-wrap; }
.bub.e { align-self: flex-start; background: #FFF0F0; color: var(--red); border-bottom-left-radius: 4px; font-size: 12px; }

/* Typing */
.typing { display: flex; gap: 5px; align-items: center; padding: 12px 14px; background: #F2F2F6; border-radius: 14px; border-bottom-left-radius: 4px; align-self: flex-start; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: bop 1.1s infinite; }
.dot:nth-child(2) { animation-delay: .18s; }
.dot:nth-child(3) { animation-delay: .36s; }
@keyframes bop { 0%,80%,100% { transform:scale(.6); opacity:.4; } 40% { transform:scale(1); opacity:1; } }

/* Chat Input */
#cf {
  padding: 10px 10px;
  border-top: 1px solid var(--border);
  display: flex; gap: 7px; align-items: flex-end;
  background: white;
}
#ci {
  flex: 1; min-height: 36px; max-height: 88px;
  padding: 8px 11px;
  border: 1.5px solid var(--border); border-radius: 10px;
  font-size: 13px; font-family: inherit; color: var(--ink);
  background: #FAFAFA; resize: none; outline: none; line-height: 1.4;
  -webkit-user-select: text; user-select: text;
}
#ci:focus { border-color: var(--blue); background: white; }
#sb {
  width: 36px; height: 36px; border-radius: 10px;
  border: none; background: var(--blue); color: white;
  cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: opacity .15s;
}
#sb:hover { opacity: .9; }

/* ── TOAST ────────────────────────────────────── */
#toast {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: rgba(27,29,46,.92); backdrop-filter: blur(8px);
  color: white; padding: 8px 18px; border-radius: 20px;
  font-size: 12.5px; font-weight: 500;
  opacity: 0; transition: opacity .24s, transform .24s;
  pointer-events: none; z-index: 300; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── CURSOR PREVIEW ───────────────────────────── */
#cur-prev {
  position: fixed;
  border-radius: 50%;
  pointer-events: none; z-index: 90;
  display: none;
  transform: translate(-50%,-50%);
  transition: width .1s, height .1s;
}

@media (max-width: 600px) {
  :root { --pw: 100vw; }
  #sz-wrap, .sz-lbl { display: none; }
  .logo { font-size: 14px; }
  #dl-btn span.dl-label { display: none; }
  .tb-label { display: none; }
}
</style>
</head>
<body>

<!-- ═══ TOOLBAR ═══ -->
<div id="toolbar">
  <span class="logo">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 20h9"/>
      <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
    </svg>
    Inkwell
  </span>
  <div class="sep"></div>

  <!-- Undo -->
  <button class="tb" id="b-undo" title="Undo (⌘Z)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="1 4 1 10 7 10"/>
      <path d="M3.51 15a9 9 0 1 0 .49-3.73"/>
    </svg>
  </button>
  <!-- Redo -->
  <button class="tb" id="b-redo" title="Redo (⌘⇧Z)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10"/>
      <path d="M20.49 15a9 9 0 1 1-.49-3.73"/>
    </svg>
  </button>
  <div class="sep"></div>

  <!-- Pen -->
  <button class="tb on" data-tool="pen" title="Pen">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
    </svg>
  </button>
  <!-- Highlighter -->
  <button class="tb" data-tool="highlighter" title="Highlighter">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 17h4l10-10-4-4L3 13v4z"/>
      <path d="M14.5 5.5l4 4"/>
      <line x1="3" y1="21" x2="21" y2="21"/>
    </svg>
  </button>
  <!-- Eraser -->
  <button class="tb" data-tool="eraser" title="Eraser">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 20H7L3 16l11-11 6 6-4 4"/>
      <path d="M6 20L18 8"/>
    </svg>
  </button>
  <!-- Select Region (AI) -->
  <button class="tb" data-tool="select" title="Select Region for AI">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="13" height="13" rx="1" stroke-dasharray="3.5 2"/>
      <path d="M16 16l5 5"/><path d="M21 16l-5 5"/>
    </svg>
  </button>
  <div class="sep"></div>

  <!-- Lasso / Object Select -->
  <button class="tb" data-tool="lasso" title="Select & Move Objects (Lasso)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 3a2 2 0 0 0-2 2"/>
      <path d="M19 3a2 2 0 0 1 2 2"/>
      <path d="M21 19a2 2 0 0 1-2 2"/>
      <path d="M5 21a2 2 0 0 1-2-2"/>
      <path d="M9 3h1"/><path d="M9 21h1"/>
      <path d="M14 3h1"/><path d="M14 21h1"/>
      <path d="M3 9v1"/><path d="M21 9v1"/>
      <path d="M3 14v1"/><path d="M21 14v1"/>
    </svg>
  </button>

  <!-- Shapes -->
  <button class="tb" id="b-shapes" title="Draw Shapes">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1"/>
      <circle cx="17.5" cy="6.5" r="3.5"/>
      <path d="M12.5 17.5l3-5 3 5z"/>
      <rect x="3" y="14" width="7" height="7" rx="3.5"/>
    </svg>
  </button>

  <!-- Import Image -->
  <button class="tb" id="b-img" title="Import Image">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <polyline points="21 15 16 10 5 21"/>
    </svg>
  </button>
  <input type="file" id="img-input" accept="image/*" style="display:none">
  <div class="sep"></div>

  <div id="colors">
    <div class="csw on" style="background:#1B1D2E" data-color="#1B1D2E"></div>
    <div class="csw"    style="background:#4361EE" data-color="#4361EE"></div>
    <div class="csw"    style="background:#EF4444" data-color="#EF4444"></div>
    <div class="csw"    style="background:#22C55E" data-color="#22C55E"></div>
    <div class="csw"    style="background:#F59E0B" data-color="#F59E0B"></div>
    <div class="csw"    style="background:#8B5CF6" data-color="#8B5CF6"></div>
  </div>
  <div class="sep"></div>

  <div id="sz-wrap">
    <span class="sz-lbl">Size</span>
    <input type="range" id="sz" min="1" max="24" value="3">
  </div>

  <div class="spacer"></div>

  <!-- Clear -->
  <button class="tb" id="b-clr" title="Clear canvas">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="3 6 5 6 21 6"/>
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
    </svg>
  </button>

  <!-- Download PDF -->
  <button id="dl-btn" title="Download as PDF">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    <span class="dl-label">PDF</span>
  </button>

  <!-- AI Button -->
  <button id="ai-btn">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2c0 0 1.6 6.4 6 8-4.4 1.6-6 8-6 8s-1.6-6.4-6-8c4.4-1.6 6-8 6-8z"/>
      <path d="M5 4c0 0 .9 3.5 3 4.5-2.1.9-3 4.5-3 4.5s-.9-3.5-3-4.5C4.1 7.5 5 4 5 4z" opacity=".6"/>
    </svg>
    Ask AI
  </button>
</div>

<!-- ═══ SHAPES POPOVER ═══ -->
<div id="shapes-pop">
  <!-- Rect -->
  <button class="shape-opt" data-shape="rect" title="Rectangle">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="6" width="18" height="12" rx="1"/>
    </svg>
    Rect
  </button>
  <!-- Circle -->
  <button class="shape-opt" data-shape="circle" title="Ellipse/Circle">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <ellipse cx="12" cy="12" rx="9" ry="7"/>
    </svg>
    Circle
  </button>
  <!-- Line -->
  <button class="shape-opt" data-shape="line" title="Straight Line">

<!-- ═══ TOAST ═══ -->
<div id="toast"></div>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
// ════════════════════════════════════════════════════════
// CANVAS ENGINE
// ════════════════════════════════════════════════════════
const cv   = document.getElementById('cv');
const ctx  = cv.getContext('2d');
const area = document.getElementById('area');
const selEl= document.getElementById('sel');
const cpEl = document.getElementById('cur-prev');

let dpr = window.devicePixelRatio || 1;

// Viewport
let vx = 0, vy = 0, vs = 1;

// Strokes (pen/highlighter/eraser)
let strokes = [];
let cur = null;
let penDown = false;

// Objects (shapes + images)
let objects = [];
let objIdCounter = 0;

// Unified history
let history  = []; // {type, data}
let histFuture = [];

// Current tool
let tool  = 'pen';
let color = '#1B1D2E';
let size  = 3;

// Pointer tracking
const ptrs = new Map();
let pinch = { dist: 0, vx: 0, vy: 0, vs: 0, mx: 0, my: 0 };
let pan   = { cx: 0, cy: 0, vx: 0, vy: 0 };
let inTouch = false;

// AI selection
let selActive = false;
let selStart  = { x: 0, y: 0 };
let selRect   = null;
let captured  = null;

// Lasso / object select state
let selectedIds  = new Set();
let lassoState   = null; // 'draw'|'drag'|'resize'
let lassoStart   = null;
let lassoRect    = null;
let dragStart    = null;
let resizeStart  = null;
let resizeHandle = null;
let resizeObjId  = null;
let touchSelStart = null;

// Shape drawing state
let isDrawingShape = false;
let shapeStart     = null;
let shapePreview   = null;

// ════════════════════════════════════════════════════════
// RESIZE CANVAS
// ════════════════════════════════════════════════════════
function resize() {
  dpr = window.devicePixelRatio || 1;
  const W = area.clientWidth, H = area.clientHeight;
  cv.width  = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  cv.style.width  = W + 'px';
  cv.style.height = H + 'px';
  draw();
}
window.addEventListener('resize', resize);
resize();

// ════════════════════════════════════════════════════════
// COORDINATE HELPERS
// ════════════════════════════════════════════════════════
function areaRect() { return area.getBoundingClientRect(); }

function s2c(sx, sy) { // screen → canvas
  return { x: (sx - vx) / vs, y: (sy - vy) / vs };
}
function c2s(cx, cy) { // canvas → screen
  return { x: cx * vs + vx, y: cy * vs + vy };
}

function evXY(e) {
  const r = areaRect();
  return { sx: e.clientX - r.left, sy: e.clientY - r.top };
}

// ════════════════════════════════════════════════════════
// OBJECT HELPERS
// ════════════════════════════════════════════════════════
function getObjBbox(obj) {
  let {x, y, w, h} = obj;
  if (w < 0) { x = x + w; w = -w; }
  if (h < 0) { y = y + h; h = -h; }
  return {x, y, w, h};
}

function getHandlePositions(bbox, pad) {
  const {x, y, w, h} = bbox;
  const l = x - pad, r = x + w + pad;
  const t = y - pad, b = y + h + pad;
  const mx = (l + r) / 2, my = (t + b) / 2;
  return [
    {x: l,  y: t,  id: 'nw'}, {x: mx, y: t,  id: 'n'},  {x: r, y: t,  id: 'ne'},
    {x: r,  y: my, id: 'e' },
    {x: r,  y: b,  id: 'se'}, {x: mx, y: b,  id: 's'},   {x: l, y: b,  id: 'sw'},
    {x: l,  y: my, id: 'w' }
  ];
}

function hitTestObjects(sx, sy) {
  const cx = (sx - vx) / vs, cy = (sy - vy) / vs;
  for (let i = objects.length - 1; i >= 0; i--) {
    const b = getObjBbox(objects[i]);
    const pad = 4 / vs;
    if (cx >= b.x - pad && cx <= b.x + b.w + pad &&
        cy >= b.y - pad && cy <= b.y + b.h + pad) return i;
  }
  return -1;
}

function hitTestHandle(sx, sy, obj) {
  const cx = (sx - vx) / vs, cy = (sy - vy) / vs;
  const bbox = getObjBbox(obj);
  const pad = 6 / vs;
  const handles = getHandlePositions(bbox, pad);
  const thresh = 9 / vs;
  for (const h of handles) {
    if (Math.hypot(cx - h.x, cy - h.y) < thresh) return h.id;
  }
  return null;
}

function getHandleCursor(h) {
  switch (h) {
    case 'nw': case 'se': return 'nwse-resize';
    case 'ne': case 'sw': return 'nesw-resize';
    case 'n':  case 's':  return 'ns-resize';
    case 'e':  case 'w':  return 'ew-resize';
    default: return 'pointer';
  }
}

// ════════════════════════════════════════════════════════
// UNIFIED UNDO / REDO
// ════════════════════════════════════════════════════════
function pushHistory(entry) {
  history.push(entry);
  histFuture = [];
}

function undo() {
  const entry = history.pop();
  if (!entry) { toast('Nothing to undo'); return; }
  histFuture.push(entry);
  applyUndo(entry);
  draw(); updateContextBar(); toast('Undo');
}

function redo() {
  const entry = histFuture.pop();
  if (!entry) { toast('Nothing to redo'); return; }
  history.push(entry);
  applyRedo(entry);
  draw(); updateContextBar(); toast('Redo');
}

function applyUndo(e) {
  switch (e.type) {
    case 'stroke':
      strokes.pop(); break;
    case 'addObject':
      objects.splice(objects.findIndex(o => o.id === e.data.id), 1);
      selectedIds.delete(e.data.id); break;
    case 'deleteObjects':
      for (const saved of [...e.data].reverse())
        objects.splice(saved.index, 0, saved.obj);
      break;
  }
}

function applyRedo(e) {
  switch (e.type) {
    case 'stroke':
      strokes.push(e.data); break;
    case 'addObject':
      objects.push(e.data); break;
    case 'deleteObjects':
      for (const saved of [...e.data].sort((a,b) => b.index - a.index))
        objects.splice(saved.index, 1);
      break;
  }
}

// ════════════════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════════════════
function draw() {
  const W = cv.clientWidth, H = cv.clientHeight;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Paper
  ctx.fillStyle = '#FDFBF7';
  ctx.fillRect(0, 0, W, H);

  // Ruled lines
  drawLines(W, H);

  // Viewport transform
  ctx.save();
  ctx.translate(vx, vy);
  ctx.scale(vs, vs);

  // Strokes
  for (const st of strokes) renderStroke(st);
  if (cur?.pts.length) renderStroke(cur);

  // Objects
  for (const obj of objects) renderObject(obj);
  if (shapePreview) renderObject(shapePreview);

  // Selection overlay
  renderSelectionOverlay();

  ctx.restore();

  // Update floating context bar
  updateContextBar();
}

function drawLines(W, H) {
  const sp = 28 * vs;
  const oy = ((vy % sp) + sp) % sp;
  ctx.strokeStyle = 'rgba(67,97,238,0.065)';
  ctx.lineWidth = 1;
  for (let y = oy - sp; y < H + sp; y += sp) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  const mx = vx + 55 * vs;
  if (mx > 0 && mx < W) {
    ctx.strokeStyle = 'rgba(239,68,68,0.1)';
    ctx.beginPath(); ctx.moveTo(mx, 0); ctx.lineTo(mx, H); ctx.stroke();
  }
}

function renderStroke(st) {
  const pts = st.pts;
  if (!pts.length) return;
  ctx.save();
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.globalCompositeOperation = 'source-over';
  if (st.tool === 'eraser') {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.strokeStyle = 'rgba(0,0,0,1)';
    ctx.fillStyle   = 'rgba(0,0,0,1)';
    ctx.lineWidth   = st.size * 2.5;
  } else if (st.tool === 'highlighter') {
    ctx.strokeStyle = hexA(st.color, 0.28);
    ctx.fillStyle   = hexA(st.color, 0.28);
    ctx.lineWidth   = st.size * 4.5;
  } else {
    ctx.strokeStyle = st.color;
    ctx.fillStyle   = st.color;
    ctx.lineWidth   = st.size;
  }
  if (pts.length === 1) {
    ctx.beginPath();
    ctx.arc(pts[0].x, pts[0].y, ctx.lineWidth / 2, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i].x + pts[i+1].x) / 2;
      const my = (pts[i].y + pts[i+1].y) / 2;
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
    }
    ctx.lineTo(pts[pts.length-1].x, pts[pts.length-1].y);
    ctx.stroke();
  }
  ctx.restore();
}

function renderObject(obj) {
  ctx.save();
  ctx.strokeStyle = obj.color || '#1B1D2E';
  ctx.lineWidth   = obj.strokeWidth || 2;
  ctx.lineJoin = 'round';
  ctx.lineCap  = 'round';

  switch (obj.type) {
    case 'rect': {
      ctx.beginPath();
      ctx.rect(obj.x, obj.y, obj.w, obj.h);
      ctx.stroke();
      break;
    }
    case 'circle': {
      const ecx = obj.x + obj.w / 2, ecy = obj.y + obj.h / 2;
      const rx = Math.abs(obj.w / 2), ry = Math.abs(obj.h / 2);
      ctx.beginPath();
      ctx.ellipse(ecx, ecy, Math.max(1, rx), Math.max(1, ry), 0, 0, Math.PI * 2);
      ctx.stroke();
      break;
    }
    case 'line': {
      ctx.beginPath();
      ctx.moveTo(obj.x, obj.y);
      ctx.lineTo(obj.x + obj.w, obj.y + obj.h);
      ctx.stroke();
      break;
    }
    case 'arrow': {
      const x1 = obj.x, y1 = obj.y;
      const x2 = obj.x + obj.w, y2 = obj.y + obj.h;
      const len = Math.hypot(obj.w, obj.h);
      if (len < 2) break;
      const headLen = Math.max(10, Math.min(len * 0.22, 28));
      const angle = Math.atan2(y2 - y1, x2 - x1);
      // Shaft
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      // Head
      ctx.fillStyle = obj.color || '#1B1D2E';
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI/6),
                 y2 - headLen * Math.sin(angle - Math.PI/6));
      ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI/6),
                 y2 - headLen * Math.sin(angle + Math.PI/6));
      ctx.closePath();
      ctx.fill();
      break;
    }
    case 'image': {
      if (obj.imgEl && obj.imgEl.complete && obj.imgEl.naturalWidth > 0) {
        ctx.drawImage(obj.imgEl, obj.x, obj.y, obj.w, obj.h);
      }
      break;
    }
  }
  ctx.restore();
}

function renderSelectionOverlay() {
  if (selectedIds.size === 0 && !lassoRect) return;

  ctx.save();

  // Draw individual object selections
  for (const id of selectedIds) {
    const obj = objects.find(o => o.id === id);
    if (!obj) continue;
    const bbox = getObjBbox(obj);
    const pad = 6 / vs;
    const hRad = 5 / vs;
    const lw = 1.5 / vs;

    // Dashed border
    ctx.strokeStyle = '#7C3AED';
    ctx.lineWidth = lw;
    ctx.setLineDash([5/vs, 3/vs]);
    ctx.strokeRect(bbox.x - pad, bbox.y - pad, bbox.w + pad*2, bbox.h + pad*2);
    ctx.setLineDash([]);

    // Handles
    const handles = getHandlePositions(bbox, pad);
    ctx.fillStyle = 'white';
    ctx.strokeStyle = '#7C3AED';
    ctx.lineWidth = lw;
    for (const h of handles) {
      ctx.beginPath();
      ctx.arc(h.x, h.y, hRad, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
  }

  // Lasso rect
  if (lassoRect) {
    ctx.strokeStyle = '#4361EE';
    ctx.lineWidth = 1.5 / vs;
    ctx.setLineDash([5/vs, 3/vs]);
    ctx.fillStyle = 'rgba(67,97,238,0.07)';
    ctx.fillRect(lassoRect.x, lassoRect.y, lassoRect.w, lassoRect.h);
    ctx.strokeRect(lassoRect.x, lassoRect.y, lassoRect.w, lassoRect.h);
    ctx.setLineDash([]);
  }

  ctx.restore();
}

function hexA(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ════════════════════════════════════════════════════════
// CONTEXT BAR (for selected objects)
// ════════════════════════════════════════════════════════
function updateContextBar() {
  const bar = document.getElementById('obj-ctx-bar');
  if (selectedIds.size === 0 || tool !== 'lasso') {
    bar.style.display = 'none';
    return;
  }

  const r = areaRect();
  let minX = Infinity, minY = Infinity, maxX = -Infinity;

  for (const id of selectedIds) {
    const obj = objects.find(o => o.id === id);
    if (!obj) continue;
    const bbox = getObjBbox(obj);
    const sx = r.left + bbox.x * vs + vx;
    const sy = r.top + bbox.y * vs + vy;
    const ex = sx + bbox.w * vs;
    minX = Math.min(minX, sx);
    maxX = Math.max(maxX, ex);
    minY = Math.min(minY, sy);
  }

  const barX = (minX + maxX) / 2;
  const barY = minY - 46;

  bar.style.display = 'flex';
  bar.style.left = barX + 'px';
  bar.style.top  = Math.max(r.top + 4, barY) + 'px';
}

// ════════════════════════════════════════════════════════
// POINTER EVENTS
// ════════════════════════════════════════════════════════
cv.addEventListener('pointerdown',   onDown,   { passive: false });
cv.addEventListener('pointermove',   onMove,   { passive: false });
cv.addEventListener('pointerup',     onUp,     { passive: false });
cv.addEventListener('pointercancel', onCancel, { passive: false });

const SHAPE_TOOLS = new Set(['rect','circle','line','arrow']);

function onDown(e) {
  e.preventDefault();
  ptrs.set(e.pointerId, { cx: e.clientX, cy: e.clientY, type: e.pointerType });

  if (e.pointerType === 'pen' || e.pointerType === 'mouse') {
    cv.setPointerCapture(e.pointerId);
    if (tool === 'select')             startSel(e);
    else if (tool === 'lasso')         startLasso(e);
    else if (SHAPE_TOOLS.has(tool))    startShape(e);
    else                               startStroke(e);
  } else if (e.pointerType === 'touch') {
    const tp = getTouches();
    if (tp.length === 1) {
      // Lasso: support touch tap to select
      if (tool === 'lasso') {
        touchSelStart = { time: Date.now(), cx: e.clientX, cy: e.clientY };
      }
      pan = { cx: e.clientX, cy: e.clientY, vx, vy };
      inTouch = true;
    } else if (tp.length === 2) {
      const [a, b] = tp;
      const dist = Math.hypot(a.cx - b.cx, a.cy - b.cy);
      const r = areaRect();
      pinch = { dist, vx, vy, vs,
        mx: (a.cx + b.cx)/2 - r.left,
        my: (a.cy + b.cy)/2 - r.top
      };
      inTouch = true;
    }
  }
}

function onMove(e) {
  e.preventDefault();
  ptrs.set(e.pointerId, { cx: e.clientX, cy: e.clientY, type: e.pointerType });

  if (e.pointerType === 'pen' || e.pointerType === 'mouse') {
    showCursor(e);
    if (tool === 'select' && selActive)      updateSel(e);
    else if (tool === 'lasso')               updateLasso(e);
    else if (SHAPE_TOOLS.has(tool) && isDrawingShape) updateShape(e);
    else if (penDown)                        continueStroke(e);
  } else if (e.pointerType === 'touch' && inTouch) {
    const tp = getTouches();
    if (tp.length === 1) {
      const dx = e.clientX - pan.cx, dy = e.clientY - pan.cy;
      vx = pan.vx + dx; vy = pan.vy + dy;
      draw();
    } else if (tp.length >= 2) {
      const [a, b] = tp;
      const nd  = Math.hypot(a.cx - b.cx, a.cy - b.cy);
      const nv  = Math.max(0.12, Math.min(12, pinch.vs * (nd / pinch.dist)));
      const r   = areaRect();
      const cmx = (a.cx + b.cx)/2 - r.left;
      const cmy = (a.cy + b.cy)/2 - r.top;
      const cvX = (pinch.mx - pinch.vx) / pinch.vs;
      const cvY = (pinch.my - pinch.vy) / pinch.vs;
      vs = nv; vx = cmx - cvX * nv; vy = cmy - cvY * nv;
      draw();
    }
  }
}

function onUp(e) {
  e.preventDefault();
  if (e.pointerType === 'pen' || e.pointerType === 'mouse') {
    hideCursor();
    if (tool === 'select')             finishSel(e);
    else if (tool === 'lasso')         endLasso(e);
    else if (SHAPE_TOOLS.has(tool))    endShape(e);
    else                               endStroke();
  } else if (e.pointerType === 'touch') {
    // Lasso tap-to-select on touch
    if (tool === 'lasso' && touchSelStart) {
      const dt = Date.now() - touchSelStart.time;
      const d  = Math.hypot(e.clientX - touchSelStart.cx, e.clientY - touchSelStart.cy);
      if (dt < 300 && d < 12) {
        const {sx, sy} = evXY(e);
        const hitIdx = hitTestObjects(sx, sy);
        if (hitIdx >= 0) {
          selectedIds.clear();
          selectedIds.add(objects[hitIdx].id);
        } else {
          selectedIds.clear();
        }
        draw(); updateContextBar();
      }
      touchSelStart = null;
    }

    inTouch = false;
    ptrs.delete(e.pointerId);
    const rem = getTouches();
    if (rem.length === 1) {
      pan = { cx: rem[0].cx, cy: rem[0].cy, vx, vy };
      inTouch = true;
    }
    return;
  }
  ptrs.delete(e.pointerId);
}

function onCancel(e) {
  ptrs.delete(e.pointerId);
  endStroke(); isDrawingShape = false; shapePreview = null;
  inTouch = false; hideCursor();
}

function getTouches() {
  return [...ptrs.values()].filter(p => p.type === 'touch');
}

// ════════════════════════════════════════════════════════
// CURSOR PREVIEW
// ════════════════════════════════════════════════════════
function showCursor(e) {
  if (tool === 'select' || tool === 'lasso' || SHAPE_TOOLS.has(tool)) {
    if (tool === 'lasso') updateLassoCursor(e);
    return;
  }
  const r = areaRect();
  const px = e.clientX, py = e.clientY;
  if (px < r.left || px > r.right || py < r.top || py > r.bottom) return;

  let d, bg, border;
  if (tool === 'eraser') {
    d = size * 2.5 * vs; bg = 'rgba(255,255,255,0.7)'; border = '1.5px solid #aaa';
  } else if (tool === 'highlighter') {
    d = size * 4.5 * vs; bg = hexA(color, 0.3); border = 'none';
  } else {
    d = size * vs; bg = color; border = 'none';
  }
  d = Math.max(4, Math.min(80, d));
  cpEl.style.display = 'block';
  cpEl.style.left = px + 'px'; cpEl.style.top = py + 'px';
  cpEl.style.width = d + 'px'; cpEl.style.height = d + 'px';
  cpEl.style.background = bg;
  cpEl.style.border = border;
}
function hideCursor() { cpEl.style.display = 'none'; }

function updateLassoCursor(e) {
  if (!e) return;
  const {sx, sy} = evXY(e);
  if (lassoState === 'drag')   { cv.style.cursor = 'move'; return; }
  if (lassoState === 'resize') { cv.style.cursor = getHandleCursor(resizeHandle); return; }
  // Hover test
  for (const id of selectedIds) {
    const obj = objects.find(o => o.id === id);
    if (!obj) continue;
    const h = hitTestHandle(sx, sy, obj);
    if (h) { cv.style.cursor = getHandleCursor(h); return; }
  }
  if (hitTestObjects(sx, sy) >= 0) { cv.style.cursor = 'move'; return; }
  cv.style.cursor = 'default';
}

// ════════════════════════════════════════════════════════
// STROKE
// ════════════════════════════════════════════════════════
function startStroke(e) {
  penDown = true;
  const { sx, sy } = evXY(e);
  const pt = s2c(sx, sy);
  cur = { tool, color, size, pts: [pt] };
}

function continueStroke(e) {
  if (!penDown || !cur) return;
  const { sx, sy } = evXY(e);
  cur.pts.push(s2c(sx, sy));
  draw();
}

function endStroke() {
  if (!penDown) return;
  penDown = false;
  if (cur?.pts.length) {
    strokes.push(cur);
    pushHistory({ type: 'stroke', data: cur });
  }
  cur = null;
}

// ════════════════════════════════════════════════════════
// SHAPE DRAWING
// ════════════════════════════════════════════════════════
function startShape(e) {
  const { sx, sy } = evXY(e);
  const cx = (sx - vx) / vs, cy = (sy - vy) / vs;
  isDrawingShape = true;
  shapeStart = { cx, cy };
  shapePreview = {
    id: -1, type: tool,
    x: cx, y: cy, w: 0, h: 0,
    color, strokeWidth: size
  };
}

function updateShape(e) {
  if (!isDrawingShape || !shapePreview) return;
  const { sx, sy } = evXY(e);
  shapePreview.w = (sx - vx) / vs - shapeStart.cx;
  shapePreview.h = (sy - vy) / vs - shapeStart.cy;
  draw();
}

function endShape(e) {
  if (!isDrawingShape || !shapePreview) return;
  isDrawingShape = false;

  if (Math.abs(shapePreview.w) > 4 || Math.abs(shapePreview.h) > 4) {
    let obj = { ...shapePreview, id: objIdCounter++ };

    // Normalize rect & circle to positive w/h
    if (obj.type === 'rect' || obj.type === 'circle') {
      const b = getObjBbox(obj);
      obj.x = b.x; obj.y = b.y; obj.w = b.w; obj.h = b.h;
    }

    objects.push(obj);
    pushHistory({ type: 'addObject', data: obj });
  }

  shapePreview = null;
  draw();
}

// ════════════════════════════════════════════════════════
// LASSO / OBJECT SELECT
// ════════════════════════════════════════════════════════
function startLasso(e) {
  const { sx, sy } = evXY(e);

  // 1. Check resize handles of selected objects
  for (const id of selectedIds) {
    const obj = objects.find(o => o.id === id);
    if (!obj) continue;
    const h = hitTestHandle(sx, sy, obj);
    if (h) {
      lassoState   = 'resize';
      resizeHandle = h;
      resizeObjId  = id;
      const bbox   = getObjBbox(obj);
      resizeStart  = {
        cx: (sx - vx) / vs, cy: (sy - vy) / vs,
        bbox: { ...bbox }
      };
      return;
    }
  }

  // 2. Check object body
  const hitIdx = hitTestObjects(sx, sy);
  if (hitIdx >= 0) {
    const hitObj = objects[hitIdx];
    if (!selectedIds.has(hitObj.id)) {
      selectedIds.clear();
      selectedIds.add(hitObj.id);
    }
    lassoState = 'drag';
    dragStart  = {
      cx: (sx - vx) / vs, cy: (sy - vy) / vs,
      snapshots: [...selectedIds].map(id => {
        const o = objects.find(x => x.id === id);
        return o ? { id, x: o.x, y: o.y } : null;
      }).filter(Boolean)
    };
    draw(); updateContextBar();
    return;
  }

  // 3. Start lasso rectangle
  selectedIds.clear();
  lassoState = 'draw';
  const cx = (sx - vx) / vs, cy = (sy - vy) / vs;
  lassoStart = { cx, cy };
  lassoRect  = null;
  draw(); updateContextBar();
}

function updateLasso(e) {
  const { sx, sy } = evXY(e);
  const cx = (sx - vx) / vs, cy = (sy - vy) / vs;

  if (lassoState === 'draw') {
    const x = Math.min(lassoStart.cx, cx);
    const y = Math.min(lassoStart.cy, cy);
    const w = Math.abs(cx - lassoStart.cx);
    const h = Math.abs(cy - lassoStart.cy);
    lassoRect = { x, y, w, h };
    draw();
  } else if (lassoState === 'drag') {
    const dx = cx - dragStart.cx;
    const dy = cy - dragStart.cy;
    for (const snap of dragStart.snapshots) {
      const obj = objects.find(o => o.id === snap.id);
      if (obj) { obj.x = snap.x + dx; obj.y = snap.y + dy; }
    }
    draw(); updateContextBar();
  } else if (lassoState === 'resize') {
    const obj = objects.find(o => o.id === resizeObjId);
    if (obj) { applyResize(obj, cx, cy); draw(); updateContextBar(); }
  }

  // Update cursor hint
  updateLassoCursor(e);
}

function endLasso(e) {
  if (lassoState === 'draw' && lassoRect) {
    for (const obj of objects) {
      const b = getObjBbox(obj);
      // Select if object overlaps lasso (even partially)
      if (b.x < lassoRect.x + lassoRect.w &&
          b.x + b.w > lassoRect.x &&
          b.y < lassoRect.y + lassoRect.h &&
          b.y + b.h > lassoRect.y) {
        selectedIds.add(obj.id);
      }
    }
    lassoRect = null;
  }

  lassoState = null; resizeHandle = null; resizeObjId = null;
  resizeStart = null; dragStart = null;
  draw(); updateContextBar();
}

function applyResize(obj, cx, cy) {
  const snap = resizeStart.bbox;
  const dx   = cx - resizeStart.cx;
  const dy   = cy - resizeStart.cy;

  let nx = snap.x, ny = snap.y, nw = snap.w, nh = snap.h;

  switch (resizeHandle) {
    case 'nw': nx = snap.x + dx; ny = snap.y + dy; nw = snap.w - dx; nh = snap.h - dy; break;
    case 'n' :                   ny = snap.y + dy;                    nh = snap.h - dy; break;
    case 'ne':                   ny = snap.y + dy; nw = snap.w + dx;  nh = snap.h - dy; break;
    case 'e' :                                     nw = snap.w + dx;                    break;
    case 'se':                                     nw = snap.w + dx;  nh = snap.h + dy; break;
    case 's' :                                                         nh = snap.h + dy; break;
    case 'sw': nx = snap.x + dx;                  nw = snap.w - dx;   nh = snap.h + dy; break;
    case 'w' : nx = snap.x + dx;                  nw = snap.w - dx;                    break;
  }

  const minSize = 10;
  if (nw < minSize) { if (nx !== snap.x) nx = snap.x + snap.w - minSize; nw = minSize; }
  if (nh < minSize) { if (ny !== snap.y) ny = snap.y + snap.h - minSize; nh = minSize; }

  obj.x = nx; obj.y = ny; obj.w = nw; obj.h = nh;
}

// ════════════════════════════════════════════════════════
// DELETE / DUPLICATE / Z-ORDER
// ════════════════════════════════════════════════════════
function deleteSelected() {
  if (!selectedIds.size) return;
  const idxs = [...selectedIds]
    .map(id => objects.findIndex(o => o.id === id))
    .filter(i => i >= 0)
    .sort((a, b) => b - a);
  const deleted = idxs.map(idx => ({ index: idx, obj: objects[idx] }));
  for (const { index } of deleted) objects.splice(index, 1);
  pushHistory({ type: 'deleteObjects', data: deleted });
  selectedIds.clear();
  draw(); updateContextBar();
  toast(`Deleted ${deleted.length} object${deleted.length > 1 ? 's' : ''}`);
}

function duplicateSelected() {
  if (!selectedIds.size) return;
  const newIds = new Set();
  for (const id of selectedIds) {
    const obj = objects.find(o => o.id === id);
    if (!obj) continue;
    const copy = { ...obj, id: objIdCounter++, x: obj.x + 16, y: obj.y + 16 };
    if (obj.imgEl) copy.imgEl = obj.imgEl; // share same img element
    objects.push(copy);
    pushHistory({ type: 'addObject', data: copy });
    newIds.add(copy.id);
  }
  selectedIds.clear();
  for (const id of newIds) selectedIds.add(id);
  draw(); updateContextBar();
  toast('Duplicated');
}

function bringForward() {
  for (const id of selectedIds) {
    const idx = objects.findIndex(o => o.id === id);
    if (idx < objects.length - 1) {
      [objects[idx], objects[idx+1]] = [objects[idx+1], objects[idx]];
    }
  }
  draw();
}

function sendBackward() {
  for (const id of selectedIds) {
    const idx = objects.findIndex(o => o.id === id);
    if (idx > 0) {
      [objects[idx-1], objects[idx]] = [objects[idx], objects[idx-1]];
    }
  }
  draw();
}

// Context bar buttons
document.getElementById('ctx-del').addEventListener('click', deleteSelected);
document.getElementById('ctx-dup').addEventListener('click', duplicateSelected);
document.getElementById('ctx-fwd').addEventListener('click', bringForward);
document.getElementById('ctx-bck').addEventListener('click', sendBackward);

// ════════════════════════════════════════════════════════
// IMAGE IMPORT
// ════════════════════════════════════════════════════════
document.getElementById('b-img').addEventListener('click', () => {
  document.getElementById('img-input').click();
});

document.getElementById('img-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    const r = areaRect();
    const viewW = r.width / vs, viewH = r.height / vs;
    const maxW = viewW * 0.65, maxH = viewH * 0.65;
    let w = img.naturalWidth, h = img.naturalHeight;
    if (w > maxW || h > maxH) {
      const scale = Math.min(maxW / w, maxH / h);
      w *= scale; h *= scale;
    }
    // Center in viewport
    const vcx = -vx / vs + viewW / 2;
    const vcy = -vy / vs + viewH / 2;
    const obj = {
      id: objIdCounter++,
      type: 'image',
      x: vcx - w / 2, y: vcy - h / 2,
      w, h,
      imgEl: img,
      color: '#000', strokeWidth: 0
    };
    objects.push(obj);
    pushHistory({ type: 'addObject', data: obj });

    // Switch to lasso and select the image
    activateTool('lasso');
    selectedIds.clear();
    selectedIds.add(obj.id);
    draw(); updateContextBar();
    toast('Image imported — drag to reposition, handles to resize');
  };
  img.src = url;
  e.target.value = '';
});

// ════════════════════════════════════════════════════════
// TOOL ACTIVATION HELPER
// ════════════════════════════════════════════════════════
function activateTool(t) {
  tool = t;
  const isShape = SHAPE_TOOLS.has(t);

  document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('on'));
  document.querySelectorAll('.shape-opt').forEach(s => s.classList.remove('on'));
  document.getElementById('b-shapes').classList.remove('on');

  if (isShape) {
    document.getElementById('b-shapes').classList.add('on');
    const opt = document.querySelector(`.shape-opt[data-shape="${t}"]`);
    if (opt) opt.classList.add('on');
  } else {
    const btn = document.querySelector(`[data-tool="${t}"]`);
    if (btn) btn.classList.add('on');
  }

  // Cursor
  if (t === 'eraser')        cv.style.cursor = 'cell';
  else if (t === 'lasso')    cv.style.cursor = 'default';
  else if (isShape)          cv.style.cursor = 'crosshair';
  else                       cv.style.cursor = 'crosshair';

  // Deselect objects when leaving lasso
  if (t !== 'lasso') { selectedIds.clear(); updateContextBar(); draw(); }
}

// ════════════════════════════════════════════════════════
// TOOL CONTROLS
// ════════════════════════════════════════════════════════
document.querySelectorAll('[data-tool]').forEach(btn => {
  btn.addEventListener('click', () => {
    const t = btn.dataset.tool;
    activateTool(t);
    if (t === 'select') toast('Draw a rectangle to select a region for AI');
    if (t === 'lasso')  toast('Tap or drag to select objects • Drag to move • Handles to resize • Del to delete');
  });
});

// Color swatches

// Size slider
document.getElementById('sz').addEventListener('input', e => {
  size = +e.target.value;
});

// Wheel zoom
area.addEventListener('wheel', e => {
  e.preventDefault();
  const r = areaRect();
  const cx = e.clientX - r.left, cy = e.clientY - r.top;
  const delta = e.deltaY < 0 ? 1.12 : 1/1.12;
  const nv = Math.max(0.12, Math.min(12, vs * delta));
  vx = cx - (cx - vx) * (nv / vs);
  vy = cy - (cy - vy) * (nv / vs);
  vs = nv; draw();
}, { passive: false });

// ════════════════════════════════════════════════════════
// UNDO / REDO / CLEAR — keyboard & buttons
// ════════════════════════════════════════════════════════
document.getElementById('b-undo').addEventListener('click', undo);
document.getElementById('b-redo').addEventListener('click', redo);

document.getElementById('b-clr').addEventListener('click', () => {
  if (!strokes.length && !objects.length) return;
  if (!confirm('Clear the canvas? This cannot be undone.')) return;
  strokes = []; objects = []; history = []; histFuture = [];
  cur = null; penDown = false; selectedIds.clear();
  selRect = null; captured = null; clearSel(); updateRgnBtn();
  isDrawingShape = false; shapePreview = null;
  draw(); updateContextBar();
});

document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && !e.shiftKey && e.key === 'z') { e.preventDefault(); undo(); return; }
  if (mod && (e.key === 'y' || (e.shiftKey && e.key === 'z'))) { e.preventDefault(); redo(); return; }
  if (e.key === 'Escape') {
    selActive = false; clearSel();
    selectedIds.clear(); lassoRect = null; lassoState = null;
    draw(); updateContextBar();
  }
  if ((e.key === 'Delete' || e.key === 'Backspace') &&
      !e.target.matches('input, textarea, select')) {
    deleteSelected();
  }
});

// ════════════════════════════════════════════════════════
// AI SELECTION TOOL (existing — unchanged)
// ════════════════════════════════════════════════════════
function startSel(e) {
  selActive = true;
  const r = areaRect();
  selStart = { x: e.clientX - r.left, y: e.clientY - r.top };
  selRect = null; captured = null; clearSel(); updateRgnBtn();
}

function updateSel(e) {
  if (!selActive) return;
  const r = areaRect();
  const cx = e.clientX - r.left, cy = e.clientY - r.top;
  const x = Math.min(selStart.x, cx), y = Math.min(selStart.y, cy);
  const w = Math.abs(cx - selStart.x), h = Math.abs(cy - selStart.y);
  selRect = { sx: x, sy: y, sw: w, sh: h };
  selEl.style.display = 'block';
  selEl.style.left   = (r.left + x) + 'px';
  selEl.style.top    = (r.top  + y) + 'px';
  selEl.style.width  = w + 'px';
  selEl.style.height = h + 'px';
}

function finishSel(e) {
  selActive = false;
  if (selRect && selRect.sw > 8 && selRect.sh > 8) {
    captured = captureRegion(selRect);
    updateRgnBtn();
    toast('Region selected — tap Analyze Region in AI panel');
  } else clearSel();
}

function clearSel() { selEl.style.display = 'none'; selRect = null; }

function captureRegion(rect) {
  const tmp = document.createElement('canvas');
  tmp.width  = Math.round(rect.sw);
  tmp.height = Math.round(rect.sh);
  const tc = tmp.getContext('2d');
  tc.drawImage(cv, rect.sx * dpr, rect.sy * dpr, rect.sw * dpr, rect.sh * dpr, 0, 0, rect.sw, rect.sh);
  return tmp.toDataURL('image/jpeg', 0.88).split(',')[1];
}

function captureFullPage() {
  return cv.toDataURL('image/jpeg', 0.85).split(',')[1];
}

function updateRgnBtn() {
  document.getElementById('b-rgn').classList.toggle('rdy', !!captured);
}

// ════════════════════════════════════════════════════════
// DOWNLOAD AS PDF
// ════════════════════════════════════════════════════════
document.getElementById('dl-btn').addEventListener('click', downloadAsPDF);

async function downloadAsPDF() {
  const btn = document.getElementById('dl-btn');
  if (typeof window.jspdf === 'undefined') { toast('PDF library still loading, please retry'); return; }
  btn.classList.add('loading');
  toast('Preparing PDF…');
  await new Promise(r => setTimeout(r, 80));
  try {
    const { jsPDF } = window.jspdf;
    const cw = cv.clientWidth, ch = cv.clientHeight;
    const imgData = cv.toDataURL('image/jpeg', 0.95);
    const PX_TO_MM = 0.2646;
    const pdfW = Math.round(cw * PX_TO_MM);
    const pdfH = Math.round(ch * PX_TO_MM);
    const orientation = cw >= ch ? 'landscape' : 'portrait';
    const pdf = new jsPDF({ orientation, unit: 'mm', format: [pdfW, pdfH], compress: true });
    pdf.addImage(imgData, 'JPEG', 0, 0, pdfW, pdfH, undefined, 'FAST');
    const now = new Date();
    const stamp = now.getFullYear() + '-' +
      String(now.getMonth() + 1).padStart(2,'0') + '-' +
      String(now.getDate()).padStart(2,'0');
    pdf.save(`inkwell-notes-${stamp}.pdf`);
    toast('Notes downloaded as PDF');
  } catch (err) {
    console.error(err);
    toast('PDF export failed — please try again');
  } finally {
    btn.classList.remove('loading');
  }
}

  document.getElementById('panel').classList.remove('open');
});
document.getElementById('ks-btn').addEventListener('click', () => {
  groqKey = document.getElementById('ki').value.trim();
  localStorage.setItem('inkwell_key', groqKey);
  toast('API key saved');
});

document.getElementById('b-page').addEventListener('click', () => {
  const model = document.getElementById('ms').value;
  if (!VISION_MODELS.includes(model)) { toast('Switch to a vision model to analyze images'); return; }
  askAI('Please read and summarize everything written or drawn on this page of notes.', captureFullPage());
});

document.getElementById('b-rgn').addEventListener('click', () => {
  if (!captured) {
    document.getElementById('panel').classList.remove('open');
    activateTool('select');
    toast('Draw a rectangle on the canvas to select a region');
    return;
  }
  const model = document.getElementById('ms').value;
  if (!VISION_MODELS.includes(model)) { toast('Switch to a vision model to analyze images'); return; }
  askAI('Please carefully analyze and explain what is written or drawn in this selected region.', captured);
  captured = null; clearSel(); updateRgnBtn();
});

document.getElementById('sb').addEventListener('click', sendChat);
document.getElementById('ci').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
});
document.getElementById('ci').addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 88) + 'px';
});

function sendChat() {
  const inp = document.getElementById('ci');
  const msg = inp.value.trim();
  if (!msg) return;
  inp.value = ''; inp.style.height = '';
  askAI(msg, null);
}

async function askAI(userMsg, imgB64) {
  if (!groqKey) { toast('Enter your Groq API key first'); return; }
  const model = document.getElementById('ms').value;
  const msgs  = document.getElementById('msgs');
  const hint  = msgs.querySelector('.empty-hint');
  if (hint) hint.remove();
  addBub('u', userMsg);
  const tyEl = document.createElement('div');
  tyEl.className = 'typing';
  tyEl.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  msgs.appendChild(tyEl); msgs.scrollTop = msgs.scrollHeight;

  const apiMsgs = [{
    role: 'system',
    content: 'You are an intelligent AI assistant embedded in Inkwell, a handwriting note-taking app. When the user shares images of their handwritten notes or drawings, analyze them carefully — read handwriting, identify diagrams, explain concepts. Be clear, concise, and insightful.'
  }];
  for (const h of chatHist.slice(-8)) {
    apiMsgs.push({ role: h.role, content: h.text });
  }
  if (imgB64) {
    apiMsgs.push({
      role: 'user',
      content: [
        { type: 'image_url', image_url: { url: `data:image/jpeg;base64,${imgB64}` } },
        { type: 'text', text: userMsg }
      ]
    });
  } else {
    apiMsgs.push({ role: 'user', content: userMsg });
  }

  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${groqKey}` },
      body: JSON.stringify({ model, messages: apiMsgs, max_tokens: 1024, temperature: 0.6 })
    });
    const data = await res.json();
    tyEl.remove();
    if (!res.ok) { addBub('e', 'Error: ' + (data.error?.message || `HTTP ${res.status}`)); return; }
    const reply = data.choices[0].message.content;
    addBub('a', reply);
    chatHist.push({ role: 'user', text: userMsg });
    chatHist.push({ role: 'assistant', text: reply });
  } catch (err) {
    tyEl.remove();
    addBub('e', 'Network error: ' + err.message);
  }
}

function addBub(type, text) {
  const msgs = document.getElementById('msgs');
  const el = document.createElement('div');
  el.className = 'bub ' + type;
  el.textContent = text;
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
  return el;
}

// ════════════════════════════════════════════════════════
// TOAST
// ════════════════════════════════════════════════════════
let toastT;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
