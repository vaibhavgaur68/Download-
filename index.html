<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>PULSE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="canvas"></canvas>

  <!-- HUD overlay (visible while playing) -->
  <div id="hud" class="hidden">
    <div id="hud-score">0</div>
    <div id="hud-combo" class="hidden">×<span id="combo-val">2</span></div>
    <div id="hud-best">BEST <span id="best-val">0</span></div>
  </div>

  <!-- Lives — top left, heart shaped -->
  <div id="lives-hud" class="hidden">
    <svg id="life-0" class="life-heart" viewBox="0 0 20 18" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 16.5C10 16.5 1.5 10.5 1.5 5.5C1.5 3.01 3.51 1 6 1C7.74 1 9.26 1.97 10 3.44C10.74 1.97 12.26 1 14 1C16.49 1 18.5 3.01 18.5 5.5C18.5 10.5 10 16.5 10 16.5Z"/>
    </svg>
    <svg id="life-1" class="life-heart" viewBox="0 0 20 18" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 16.5C10 16.5 1.5 10.5 1.5 5.5C1.5 3.01 3.51 1 6 1C7.74 1 9.26 1.97 10 3.44C10.74 1.97 12.26 1 14 1C16.49 1 18.5 3.01 18.5 5.5C18.5 10.5 10 16.5 10 16.5Z"/>
    </svg>
    <svg id="life-2" class="life-heart" viewBox="0 0 20 18" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 16.5C10 16.5 1.5 10.5 1.5 5.5C1.5 3.01 3.51 1 6 1C7.74 1 9.26 1.97 10 3.44C10.74 1.97 12.26 1 14 1C16.49 1 18.5 3.01 18.5 5.5C18.5 10.5 10 16.5 10 16.5Z"/>
    </svg>
  </div>

  <!-- Level path map (right side, vertical) -->
  <div id="level-map" class="hidden"></div>

  <!-- Level label HUD -->
  <div id="level-hud" class="hidden">
    <span id="level-name-hud">VOID</span>
  </div>

  <!-- Start screen -->
  <div id="start-screen">
    <div class="screen-card">
      <div class="game-title">PULSE</div>
      <div class="game-tagline">tap the ring. feel the pressure.</div>
      <div class="ring-demo" id="ring-demo"></div>
      <button class="btn" id="start-btn">TAP TO BEGIN</button>
      <div class="key-hint">SPACE · CLICK · TAP</div>
    </div>
  </div>

  <!-- Game over screen -->
  <div id="gameover-screen" class="screen-hidden">
    <div class="screen-card">
      <div class="go-label">SCORE</div>
      <div id="final-score" class="go-score">0</div>
      <div id="new-hs-badge" class="new-hs hidden">✦ NEW BEST ✦</div>
      <div class="go-divider"></div>
      <div class="go-label">BEST</div>
      <div id="final-best" class="go-best">0</div>
      <div class="go-divider"></div>
      <div class="go-label">REACHED</div>
      <div id="final-level" class="go-level">VOID</div>
      <button class="btn" id="retry-btn">TRY AGAIN</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
