<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Inkwell — Handwriting Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Nunito:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#F0EDE6;
  --paper:#FDFCF8;
  --panel:#1C1C1E;
  --panel2:#2C2C2E;
  --panel3:#3A3A3C;
  --accent:#FF6B35;
  --accent2:#4ECDC4;
  --blue:#5B9BD5;
  --text:#FDFCF8;
  --text-dim:#8E8E93;
  --border:rgba(255,255,255,0.08);
  --radius:14px;
  --toolbar-h:58px;
  --sidebar-w:220px;
  --tr:180ms cubic-bezier(.4,0,.2,1);
}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Nunito',sans-serif;-webkit-font-smoothing:antialiased;touch-action:none;}
/* ── LAYOUT ── */
.app{display:flex;flex-direction:column;height:100dvh;overflow:hidden;}
/* ── TOPBAR ── */
.topbar{
  height:var(--toolbar-h);
  background:var(--panel);
  display:flex;align-items:center;gap:0;
  padding:0 10px;
  z-index:30;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  box-shadow:0 2px 20px rgba(0,0,0,0.35);
}
.topbar-left{display:flex;align-items:center;gap:8px;flex:1;}
.topbar-center{display:flex;align-items:center;gap:4px;justify-content:center;}
.topbar-right{display:flex;align-items:center;gap:6px;flex:1;justify-content:flex-end;}

.app-brand{
  font-family:'Caveat',cursive;
  font-size:1.4rem;font-weight:600;
  color:var(--text);
  letter-spacing:-0.01em;
  margin-right:4px;
  display:flex;align-items:center;gap:6px;
}
.brand-icon{font-size:1.2rem;}

/* page tabs */
.page-tabs{display:flex;align-items:center;gap:2px;background:var(--panel2);border-radius:10px;padding:3px;}
.page-tab{
  padding:5px 14px;
  font-size:0.75rem;font-weight:500;
  color:var(--text-dim);
  border-radius:7px;
  cursor:pointer;
  transition:background var(--tr),color var(--tr);
  white-space:nowrap;
  border:none;background:transparent;font-family:'Nunito',sans-serif;
}
.page-tab.active{background:var(--panel3);color:var(--text);}
.page-tab:hover:not(.active){color:var(--text);}
.btn-add-page{
  width:26px;height:26px;
  border-radius:6px;border:none;
  background:var(--panel3);color:var(--text-dim);
  cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;
  transition:color var(--tr),background var(--tr);margin-left:2px;
}
.btn-add-page:hover{color:var(--text);background:var(--accent);}

/* icon buttons */
.ibtn{
  width:36px;height:36px;border-radius:10px;border:none;
  background:transparent;color:var(--text-dim);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background var(--tr),color var(--tr);
  flex-shrink:0;
}
.ibtn:hover{background:var(--panel3);color:var(--text);}
.ibtn.active{background:var(--accent);color:white;}
.ibtn svg{pointer-events:none;}

/* ── BODY ── */
.body{display:flex;flex:1;overflow:hidden;position:relative;}

/* ── TOOLS SIDEBAR ── */
.tools{
  width:64px;
  background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;
  padding:12px 0;gap:4px;
  z-index:20;
  flex-shrink:0;
}
.tool-sep{width:36px;height:1px;background:var(--border);margin:4px 0;}
.tbtn{
  width:46px;height:46px;border-radius:12px;border:none;
  background:transparent;color:var(--text-dim);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:background var(--tr),color var(--tr);
  position:relative;
  font-family:'Nunito',sans-serif;
}
.tbtn:hover{background:var(--panel3);color:var(--text);}
.tbtn.active{background:var(--accent);color:white;box-shadow:0 0 16px rgba(255,107,53,0.4);}
.tbtn-label{font-size:0.55rem;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;line-height:1;}
.tbtn svg{flex-shrink:0;}

/* color dots */
.color-dot{
  width:22px;height:22px;border-radius:50%;cursor:pointer;
  border:2px solid transparent;transition:transform var(--tr),border-color var(--tr);
  flex-shrink:0;
}
.color-dot:hover{transform:scale(1.15);}
.color-dot.active{border-color:white;transform:scale(1.1);}

/* size slider */
.size-track{
  width:4px;height:80px;background:var(--panel3);border-radius:4px;
  position:relative;cursor:pointer;margin:4px 0;
}
.size-thumb{
  width:14px;height:14px;background:white;border-radius:50%;
  position:absolute;left:50%;transform:translateX(-50%);
  box-shadow:0 1px 4px rgba(0,0,0,0.4);cursor:grab;
  transition:box-shadow var(--tr);
}
.size-thumb:active{cursor:grabbing;box-shadow:0 2px 8px rgba(0,0,0,0.5);}

/* ── CANVAS AREA ── */
.canvas-area{
  flex:1;position:relative;overflow:hidden;
  background:var(--bg);
  display:flex;align-items:flex-start;justify-content:center;
  padding:24px 20px;
}
.paper-shadow{
  position:relative;
  border-radius:4px;
  box-shadow:0 4px 40px rgba(0,0,0,0.2),0 1px 4px rgba(0,0,0,0.1),inset 0 0 0 1px rgba(0,0,0,0.06);
}
#canvas{
  display:block;border-radius:4px;
  cursor:crosshair;
  touch-action:none;
  image-rendering:pixelated;
}

/* paper rule lines are drawn in canvas init */

/* ── AI PANEL ── */
.ai-panel{
  width:320px;flex-shrink:0;
  background:var(--panel);
  border-left:1px solid var(--border);
  display:flex;flex-direction:column;
  transform:translateX(100%);
  transition:transform 300ms cubic-bezier(.4,0,.2,1);
  z-index:20;
  position:absolute;right:0;top:0;bottom:0;
}
.ai-panel.open{transform:translateX(0);}
.ai-header{
  padding:16px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.ai-title{
  font-size:0.85rem;font-weight:600;color:var(--text);
  display:flex;align-items:center;gap:8px;
}
.ai-orb{
  width:8px;height:8px;border-radius:50%;background:var(--accent2);
  animation:orb-pulse 2s infinite;
}
@keyframes orb-pulse{0%,100%{box-shadow:0 0 0 0 rgba(78,205,196,0.4);}50%{box-shadow:0 0 0 6px rgba(78,205,196,0);}}

.ai-key-section{padding:12px 16px;border-bottom:1px solid var(--border);}
.ai-key-label{font-size:0.65rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;font-weight:600;}
.ai-key-input{
  width:100%;background:var(--panel2);border:1px solid var(--border);
  border-radius:8px;padding:8px 12px;font-size:0.78rem;
  color:var(--text);outline:none;font-family:'Nunito',sans-serif;
  transition:border-color var(--tr);
}
.ai-key-input:focus{border-color:var(--accent2);}
.ai-key-input::placeholder{color:var(--text-dim);}
.ai-key-status{font-size:0.67rem;margin-top:4px;min-height:14px;}
.ai-key-status.ok{color:#5AC87A;}
.ai-key-status.err{color:#FF453A;}

.ai-chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px;border-bottom:1px solid var(--border);}
.chip{
  background:var(--panel2);border:1px solid var(--border);
  border-radius:20px;padding:5px 12px;font-size:0.72rem;
  color:var(--text-dim);cursor:pointer;font-family:'Nunito',sans-serif;
  transition:border-color var(--tr),color var(--tr),background var(--tr);
}
.chip:hover{border-color:var(--accent2);color:var(--accent2);background:rgba(78,205,196,0.08);}

.ai-convo{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:var(--panel3) transparent;}
.msg{font-size:0.8rem;line-height:1.6;border-radius:10px;padding:9px 12px;}
.msg.user{background:var(--panel2);color:var(--text);align-self:flex-end;max-width:85%;}
.msg.ai{background:rgba(78,205,196,0.1);border:1px solid rgba(78,205,196,0.2);color:var(--text);align-self:flex-start;max-width:92%;}
.msg.ai-thinking{color:var(--text-dim);font-style:italic;font-size:0.75rem;align-self:flex-start;}

.ai-input-area{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end;}
.ai-textarea{
  flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:10px;
  padding:9px 12px;font-size:0.8rem;color:var(--text);
  font-family:'Nunito',sans-serif;outline:none;resize:none;
  line-height:1.5;min-height:38px;max-height:100px;
  transition:border-color var(--tr);
}
.ai-textarea:focus{border-color:var(--accent2);}
.ai-textarea::placeholder{color:var(--text-dim);}
.btn-send{
  width:36px;height:36px;border-radius:10px;border:none;
  background:var(--accent2);color:white;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:opacity var(--tr),transform var(--tr);
}
.btn-send:hover{opacity:0.85;transform:translateY(-1px);}
.btn-send:disabled{opacity:0.4;transform:none;cursor:default;}

/* ── COLOR PICKER ── */
.color-picker-popup{
  position:absolute;left:70px;
  background:var(--panel);border:1px solid var(--border);
  border-radius:14px;padding:14px;
  box-shadow:0 8px 40px rgba(0,0,0,0.4);
  display:none;z-index:50;
  flex-direction:column;gap:10px;
}
.color-picker-popup.open{display:flex;}
.color-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;}
.cpick{
  width:26px;height:26px;border-radius:50%;cursor:pointer;
  border:2px solid transparent;transition:transform .15s,border-color .15s;
}
.cpick:hover{transform:scale(1.2);}
.cpick.active{border-color:white;}
.custom-color{display:flex;align-items:center;gap:8px;margin-top:2px;}
.custom-color label{font-size:0.7rem;color:var(--text-dim);}
#custom-color-input{width:36px;height:26px;border:none;border-radius:6px;cursor:pointer;background:none;padding:0;}

/* ── OPACITY / PRESSURE DISPLAY ── */
.size-display{
  font-size:0.62rem;color:var(--text-dim);font-weight:600;
  letter-spacing:.04em;text-align:center;margin-top:2px;
}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--panel3);color:var(--text);
  padding:9px 20px;border-radius:10px;font-size:0.8rem;
  opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:200;
  white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── ZOOM CONTROLS ── */
.zoom-controls{
  position:absolute;bottom:18px;right:18px;
  display:flex;align-items:center;gap:4px;
  background:var(--panel);border-radius:10px;padding:4px;
  box-shadow:0 2px 12px rgba(0,0,0,0.3);z-index:25;
}
.zbtn{
  width:30px;height:30px;border-radius:7px;border:none;
  background:transparent;color:var(--text-dim);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:1rem;font-family:'Nunito',sans-serif;font-weight:600;
  transition:background var(--tr),color var(--tr);
}
.zbtn:hover{background:var(--panel3);color:var(--text);}
.zoom-label{font-size:0.72rem;color:var(--text-dim);min-width:38px;text-align:center;font-weight:600;}

/* ── SPINNER ── */
.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:4px;}
</style>
</head>
<body>
<div class="app">

<!-- ── TOPBAR ── -->
<div class="topbar">
  <div class="topbar-left">
    <div class="app-brand"><span class="brand-icon">🖋</span> Inkwell</div>
    <div class="page-tabs" id="page-tabs"></div>
    <button class="btn-add-page" onclick="addPage()" title="New page">+</button>
  </div>
  <div class="topbar-center">
    <button class="ibtn" onclick="undo()" title="Undo (Ctrl+Z)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 7v6h6"/><path d="M3 13C5.33 7.47 12 4 17.5 8S21 20.47 15 21"/></svg>
    </button>
    <button class="ibtn" onclick="redo()" title="Redo (Ctrl+Y)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 7v6h-6"/><path d="M21 13C18.67 7.47 12 4 6.5 8S3 20.47 9 21"/></svg>
    </button>
    <div style="width:1px;height:22px;background:var(--border);margin:0 4px;"></div>
    <button class="ibtn" onclick="clearPage()" title="Clear page">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
    </button>
    <button class="ibtn" onclick="exportPNG()" title="Export as PNG">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
  </div>
  <div class="topbar-right">
    <button class="ibtn" id="btn-ai" onclick="toggleAI()" title="AI Assistant">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2a4 4 0 0 1 4 4v1a4 4 0 0 1-4 4 4 4 0 0 1-4-4V6a4 4 0 0 1 4-4z"/><path d="M4 22v-2a7 7 0 0 1 7-7h2a7 7 0 0 1 7 7v2"/><circle cx="12" cy="8" r="1.5" fill="currentColor"/></svg>
    </button>
  </div>
</div>

<!-- ── BODY ── -->
<div class="body">

  <!-- ── TOOL SIDEBAR ── -->
  <div class="tools" id="tools">
    <!-- pen -->
    <button class="tbtn active" id="tool-pen" onclick="setTool('pen')" title="Pen">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
      <span class="tbtn-label">Pen</span>
    </button>
    <!-- brush -->
    <button class="tbtn" id="tool-brush" onclick="setTool('brush')" title="Brush">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 3a3 3 0 0 0-3 3l-7 7-1 5 5-1 7-7a3 3 0 0 0 0-7z"/><path d="M3 21l2-2"/></svg>
      <span class="tbtn-label">Brush</span>
    </button>
    <!-- highlighter -->
    <button class="tbtn" id="tool-hl" onclick="setTool('highlighter')" title="Highlighter">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="8" width="18" height="8" rx="2"/><path d="M10 8V6a2 2 0 1 1 4 0v2"/><path d="M12 16v2"/></svg>
      <span class="tbtn-label">Hl</span>
    </button>
    <!-- marker -->
    <button class="tbtn" id="tool-marker" onclick="setTool('marker')" title="Marker">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      <span class="tbtn-label">Mkr</span>
    </button>
    <div class="tool-sep"></div>
    <!-- eraser -->
    <button class="tbtn" id="tool-eraser" onclick="setTool('eraser')" title="Eraser">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 20H7L3 16l9-9 8 8z"/><path d="M6.26 6.26L2.44 10.08"/></svg>
      <span class="tbtn-label">Erase</span>
    </button>
    <!-- lasso/select -->
    <button class="tbtn" id="tool-select" onclick="setTool('select')" title="Lasso select">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 2"><ellipse cx="12" cy="12" rx="10" ry="6"/></svg>
      <span class="tbtn-label">Lasso</span>
    </button>
    <div class="tool-sep"></div>
    <!-- color picker trigger -->
    <button class="tbtn" id="btn-color" onclick="toggleColorPicker(event)" title="Color">
      <div id="cur-color-dot" style="width:22px;height:22px;border-radius:50%;background:#1A1A2E;border:2px solid rgba(255,255,255,0.3);"></div>
      <span class="tbtn-label">Color</span>
    </button>
    <!-- size slider -->
    <div class="size-display" id="size-display">3px</div>
    <div class="size-track" id="size-track">
      <div class="size-thumb" id="size-thumb"></div>
    </div>
    <div class="size-display" style="font-size:0.55rem;color:var(--text-dim)">SIZE</div>
  </div>

  <!-- ── COLOR PICKER POPUP ── -->
  <div class="color-picker-popup" id="color-picker-popup">
    <div class="color-grid" id="color-grid"></div>
    <div class="custom-color">
      <label>Custom</label>
      <input type="color" id="custom-color-input" value="#000000" oninput="setColor(this.value)">
    </div>
  </div>

  <!-- ── CANVAS AREA ── -->
  <div class="canvas-area" id="canvas-area">
    <div class="paper-shadow" id="paper-shadow">
      <canvas id="canvas"></canvas>
    </div>
    <!-- zoom -->
    <div class="zoom-controls">
      <button class="zbtn" onclick="zoom(-0.1)">−</button>
      <span class="zoom-label" id="zoom-label">100%</span>
      <button class="zbtn" onclick="zoom(0.1)">+</button>
      <button class="zbtn" onclick="resetZoom()" title="Reset zoom" style="font-size:.65rem;min-width:36px;">Fit</button>
    </div>
  </div>

  <!-- ── AI PANEL ── -->
  <div class="ai-panel" id="ai-panel">
    <div class="ai-header">
      <div class="ai-title"><div class="ai-orb"></div> AI Assistant</div>
      <button class="ibtn" onclick="toggleAI()" style="width:28px;height:28px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="ai-key-section">
      <div class="ai-key-label">Anthropic API Key</div>
      <input class="ai-key-input" id="ai-key-input" type="password" placeholder="sk-ant-…" oninput="handleApiKey(this.value)" autocomplete="off">
      <div class="ai-key-status" id="ai-key-status"></div>
    </div>
    <div class="ai-chips">
      <button class="chip" onclick="aiPrompt('Describe what you see in these notes and suggest how to organize them')">Organize notes</button>
      <button class="chip" onclick="aiPrompt('What are the key topics in these handwritten notes?')">Key topics</button>
      <button class="chip" onclick="aiPrompt('Create a clean summary of these notes in bullet points')">Summarize</button>
      <button class="chip" onclick="aiPrompt('What questions should I ask to expand on these notes?')">Deep dive</button>
    </div>
    <div class="ai-convo" id="ai-convo">
      <div class="msg ai-thinking">Enter your API key and start chatting. I can help you organize, summarize, or expand on your notes.</div>
    </div>
    <div class="ai-input-area">
      <textarea class="ai-textarea" id="ai-textarea" placeholder="Ask about your notes…" rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAI();}"></textarea>
      <button class="btn-send" id="btn-send-ai" onclick="sendAI()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

</div><!-- end body -->
</div><!-- end app -->

<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════════════════
const PALETTE = [
  '#1A1A2E','#16213E','#0F3460','#2C3E50',
  '#E74C3C','#E67E22','#F1C40F','#27AE60',
  '#2980B9','#8E44AD','#1ABC9C','#FF6B6B',
  '#4ECDC4','#45B7D1','#96CEB4','#FFEAA7',
  '#DDA0DD','#F0E68C','#FFB347','#FFFFFF',
];

const PAPER_W = 1668; // iPad Pro 12.9" equiv pixel width at 2x
const PAPER_H = 2224;

let pages = []; // {strokes:[], undoStack:[], redoStack:[]}
let currentPage = 0;
let currentTool = 'pen';
let currentColor = '#1A1A2E';
let currentSize = 3;
let isDrawing = false;
let lastPoint = null;
let lastPressure = 0.5;
let palmRejecting = false;
let activeTouches = [];
let scale = 1;
let canvasScale = window.devicePixelRatio || 2; // retina
let apiKey = localStorage.getItem('inkwell_key') || '';
let aiHistory = [];

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// ════════════════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════════════════
function init() {
  // Set canvas physical and CSS size
  canvas.width = PAPER_W * canvasScale;
  canvas.height = PAPER_H * canvasScale;
  canvas.style.width = PAPER_W + 'px';
  canvas.style.height = PAPER_H + 'px';

  // Adjust for display
  fitToWindow();

  // Create first page
  addPage();
  addPage();
  switchPage(0);

  // API key
  if (apiKey) {
    document.getElementById('ai-key-input').value = apiKey;
    setKeyStatus('ok','Key loaded ✓');
  }

  // Color palette
  const grid = document.getElementById('color-grid');
  PALETTE.forEach(c => {
    const d = document.createElement('div');
    d.className = 'cpick' + (c === currentColor ? ' active' : '');
    d.style.background = c;
    d.onclick = () => { setColor(c); toggleColorPicker(); };
    grid.appendChild(d);
  });
  document.getElementById('cur-color-dot').style.background = currentColor;

  // Size slider
  initSizeSlider();

  // Events
  canvas.addEventListener('pointerdown', onPointerDown, {passive:false});
  canvas.addEventListener('pointermove', onPointerMove, {passive:false});
  canvas.addEventListener('pointerup', onPointerUp, {passive:false});
  canvas.addEventListener('pointercancel', onPointerUp, {passive:false});
  canvas.addEventListener('pointerleave', onPointerUp, {passive:false});
  window.addEventListener('keydown', onKey);
  window.addEventListener('resize', onResize);

  // Prevent context menu on long press
  canvas.addEventListener('contextmenu', e => e.preventDefault());
}

function fitToWindow() {
  const area = document.getElementById('canvas-area');
  const aw = area.clientWidth - 80;
  const ah = area.clientHeight - 48;
  scale = Math.min(aw / PAPER_W, ah / PAPER_H, 1);
  applyScale();
}

function applyScale() {
  canvas.style.transform = `scale(${scale})`;
  canvas.style.transformOrigin = 'top center';
  const ps = document.getElementById('paper-shadow');
  ps.style.width = PAPER_W + 'px';
  ps.style.height = PAPER_H + 'px';
  ps.style.transform = `scale(${scale})`;
  ps.style.transformOrigin = 'top center';
  const area = document.getElementById('canvas-area');
  area.style.minHeight = (PAPER_H * scale + 48) + 'px';
  document.getElementById('zoom-label').textContent = Math.round(scale * 100) + '%';
}

function zoom(delta) {
  scale = Math.min(Math.max(scale + delta, 0.3), 3);
  applyScale();
}
function resetZoom() { fitToWindow(); }
function onResize() { fitToWindow(); }

// ════════════════════════════════════════════════════════════════════════════
// PAGES
// ════════════════════════════════════════════════════════════════════════════
function addPage() {
  pages.push({ strokes: [], undoStack: [], redoStack: [] });
  renderPageTabs();
}

function switchPage(idx) {
  saveCurrentStrokes();
  currentPage = idx;
  renderPageTabs();
  redrawAll();
}

function saveCurrentStrokes() { /* strokes saved on each stroke end */ }

function renderPageTabs() {
  const tabsEl = document.getElementById('page-tabs');
  tabsEl.innerHTML = pages.map((p, i) =>
    `<button class="page-tab ${i===currentPage?'active':''}" onclick="switchPage(${i})">Page ${i+1}</button>`
  ).join('');
}

// ════════════════════════════════════════════════════════════════════════════
// CANVAS DRAWING
// ════════════════════════════════════════════════════════════════════════════
function clearCanvas() {
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.restore();
}

function drawPaperBackground() {
  const w = canvas.width, h = canvas.height;
  const s = canvasScale;
  // White paper
  ctx.fillStyle = '#FDFCF8';
  ctx.fillRect(0,0,w,h);
  // Margin line
  ctx.strokeStyle = 'rgba(255,100,80,0.15)';
  ctx.lineWidth = s * 1.5;
  ctx.beginPath();
  ctx.moveTo(80*s,0);
  ctx.lineTo(80*s,h);
  ctx.stroke();
  // Rule lines
  const lineGap = 44 * s;
  const startY = 120 * s;
  ctx.strokeStyle = 'rgba(100,140,200,0.12)';
  ctx.lineWidth = s * 0.8;
  for (let y = startY; y < h; y += lineGap) {
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(w,y);
    ctx.stroke();
  }
  // Hole punches
  [200,600,1000].forEach(y => {
    ctx.strokeStyle = 'rgba(180,180,180,0.3)';
    ctx.lineWidth = s;
    ctx.beginPath();
    ctx.arc(30*s, y*s, 12*s, 0, Math.PI*2);
    ctx.stroke();
  });
}

function redrawAll() {
  clearCanvas();
  drawPaperBackground();
  const page = pages[currentPage];
  if (!page) return;
  page.strokes.forEach(stroke => replayStroke(stroke));
}

function replayStroke(stroke) {
  if (!stroke.points || stroke.points.length === 0) return;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  if (stroke.tool === 'highlighter') {
    ctx.globalAlpha = 0.35;
    ctx.globalCompositeOperation = 'multiply';
    ctx.strokeStyle = stroke.color;
    ctx.lineWidth = stroke.size * canvasScale * 6;
    tracePoints(stroke.points);
    ctx.stroke();
  } else if (stroke.tool === 'eraser') {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.strokeStyle = 'rgba(0,0,0,1)';
    ctx.lineWidth = stroke.size * canvasScale * 5;
    tracePoints(stroke.points);
    ctx.stroke();
  } else if (stroke.tool === 'marker') {
    ctx.globalAlpha = 0.85;
    ctx.strokeStyle = stroke.color;
    ctx.lineWidth = stroke.size * canvasScale * 4;
    tracePoints(stroke.points);
    ctx.stroke();
  } else if (stroke.tool === 'brush') {
    // Variable width brush
    drawVariableStroke(stroke);
  } else {
    // Pen - variable pressure
    ctx.globalAlpha = 1;
    ctx.strokeStyle = stroke.color;
    drawVariableStroke(stroke);
  }
  ctx.restore();
}

function tracePoints(points) {
  if (points.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(points[0].x * canvasScale, points[0].y * canvasScale);
  for (let i = 1; i < points.length - 1; i++) {
    const mx = (points[i].x + points[i+1].x) / 2 * canvasScale;
    const my = (points[i].y + points[i+1].y) / 2 * canvasScale;
    ctx.quadraticCurveTo(points[i].x*canvasScale, points[i].y*canvasScale, mx, my);
  }
  const last = points[points.length-1];
  ctx.lineTo(last.x*canvasScale, last.y*canvasScale);
}

function drawVariableStroke(stroke) {
  const pts = stroke.points;
  if (pts.length < 2) return;
  for (let i = 1; i < pts.length; i++) {
    const p0 = pts[i-1], p1 = pts[i];
    const pressure = (p0.pressure + p1.pressure) / 2;
    let lw;
    if (stroke.tool === 'brush') {
      lw = stroke.size * canvasScale * pressure * 5;
    } else {
      // pen — taper with pressure
      lw = stroke.size * canvasScale * (0.4 + pressure * 1.6);
    }
    ctx.beginPath();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = stroke.color;
    ctx.lineWidth = lw;
    ctx.moveTo(p0.x*canvasScale, p0.y*canvasScale);
    ctx.lineTo(p1.x*canvasScale, p1.y*canvasScale);
    ctx.stroke();
  }
}

// ════════════════════════════════════════════════════════════════════════════
// POINTER EVENTS — core drawing
// ════════════════════════════════════════════════════════════════════════════
let currentStroke = null;

function getCanvasPoint(e) {
  const rect = canvas.getBoundingClientRect();
  // rect accounts for CSS transform via getBoundingClientRect
  const x = (e.clientX - rect.left) / scale;
  const y = (e.clientY - rect.top) / scale;
  return {x, y};
}

function getPressure(e) {
  if (e.pressure !== undefined && e.pressure > 0) return e.pressure;
  if (e.force !== undefined && e.force > 0) return e.force;
  return 0.5;
}

function isPalmTouch(e) {
  // Palm rejection: ignore touches with large contact area or non-primary pointer when drawing
  if (e.pointerType === 'touch') {
    const w = e.width || 0, h = e.height || 0;
    if (w > 40 || h > 40) return true; // large = palm
    if (activeTouches.length > 1) return true; // multi-touch = gesture
  }
  return false;
}

function onPointerDown(e) {
  e.preventDefault();
  if (e.pointerType === 'touch') {
    activeTouches.push(e.pointerId);
    if (activeTouches.length > 1) { palmRejecting = true; finishStroke(); return; }
  }
  if (isPalmTouch(e)) { palmRejecting = true; return; }
  palmRejecting = false;

  if (currentTool === 'select') return; // placeholder

  canvas.setPointerCapture(e.pointerId);
  isDrawing = true;
  const pt = getCanvasPoint(e);
  const pressure = getPressure(e);
  currentStroke = {
    tool: currentTool,
    color: currentColor,
    size: currentSize,
    points: [{...pt, pressure}]
  };
  lastPoint = pt;
  lastPressure = pressure;
}

function onPointerMove(e) {
  e.preventDefault();
  if (!isDrawing || palmRejecting) return;
  if (!currentStroke) return;

  const pt = getCanvasPoint(e);
  const pressure = getPressure(e);

  // Smooth pressure
  const smoothP = lastPressure * 0.6 + pressure * 0.4;
  lastPressure = smoothP;

  currentStroke.points.push({...pt, pressure: smoothP});
  lastPoint = pt;

  // Live draw last segment
  liveDrawSegment(currentStroke);
}

function liveDrawSegment(stroke) {
  const pts = stroke.points;
  if (pts.length < 2) return;
  const p0 = pts[pts.length-2], p1 = pts[pts.length-1];
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  if (stroke.tool === 'highlighter') {
    ctx.globalAlpha = 0.35;
    ctx.globalCompositeOperation = 'multiply';
    ctx.strokeStyle = stroke.color;
    ctx.lineWidth = stroke.size * canvasScale * 6;
    ctx.beginPath();
    ctx.moveTo(p0.x*canvasScale, p0.y*canvasScale);
    ctx.lineTo(p1.x*canvasScale, p1.y*canvasScale);
    ctx.stroke();
  } else if (stroke.tool === 'eraser') {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = stroke.size * canvasScale * 5;
    ctx.beginPath();
    ctx.moveTo(p0.x*canvasScale, p0.y*canvasScale);
    ctx.lineTo(p1.x*canvasScale, p1.y*canvasScale);
    ctx.stroke();
  } else if (stroke.tool === 'marker') {
    ctx.globalAlpha = 0.85;
    ctx.strokeStyle = stroke.color;
    ctx.lineWidth = stroke.size * canvasScale * 4;
    ctx.beginPath();
    ctx.moveTo(p0.x*canvasScale, p0.y*canvasScale);
    ctx.lineTo(p1.x*canvasScale, p1.y*canvasScale);
    ctx.stroke();
  } else {
    const pressure = (p0.pressure + p1.pressure) / 2;
    let lw = stroke.tool === 'brush'
      ? stroke.size * canvasScale * pressure * 5
      : stroke.size * canvasScale * (0.4 + pressure * 1.6);
    ctx.strokeStyle = stroke.color;
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.moveTo(p0.x*canvasScale, p0.y*canvasScale);
    ctx.lineTo(p1.x*canvasScale, p1.y*canvasScale);
    ctx.stroke();
  }
  ctx.restore();
}

function onPointerUp(e) {
  if (e.pointerType === 'touch') {
    activeTouches = activeTouches.filter(id => id !== e.pointerId);
    if (activeTouches.length === 0) palmRejecting = false;
  }
  finishStroke();
}

function finishStroke() {
  if (!isDrawing || !currentStroke) return;
  isDrawing = false;
  if (currentStroke.points.length > 1) {
    const page = pages[currentPage];
    page.strokes.push(currentStroke);
    page.undoStack.push({type:'stroke', stroke: currentStroke});
    page.redoStack = [];
  }
  currentStroke = null;
}

// ════════════════════════════════════════════════════════════════════════════
// TOOLS & COLORS
// ════════════════════════════════════════════════════════════════════════════
function setTool(t) {
  currentTool = t;
  document.querySelectorAll('.tbtn').forEach(b => b.classList.remove('active'));
  document.getElementById('tool-' + (t==='highlighter'?'hl':t==='select'?'select':t)).classList.add('active');
  if (t === 'eraser') canvas.style.cursor = 'cell';
  else canvas.style.cursor = 'crosshair';
}

function setColor(c) {
  currentColor = c;
  document.getElementById('cur-color-dot').style.background = c;
  document.querySelectorAll('.cpick').forEach(el => {
    el.classList.toggle('active', el.style.background === c || rgbToHex(el.style.background) === c.toLowerCase());
  });
}

function rgbToHex(rgb) {
  const r = rgb.match(/\d+/g);
  if (!r || r.length < 3) return rgb;
  return '#' + r.slice(0,3).map(x => parseInt(x).toString(16).padStart(2,'0')).join('');
}

function toggleColorPicker(e) {
  if (e) e.stopPropagation();
  const popup = document.getElementById('color-picker-popup');
  popup.classList.toggle('open');
  if (popup.classList.contains('open')) {
    const btn = document.getElementById('btn-color');
    const r = btn.getBoundingClientRect();
    popup.style.top = r.top + 'px';
  }
}
document.addEventListener('click', e => {
  const popup = document.getElementById('color-picker-popup');
  if (!popup.contains(e.target) && e.target.id !== 'btn-color' && !e.target.closest('#btn-color')) {
    popup.classList.remove('open');
  }
});

// ════════════════════════════════════════════════════════════════════════════
// SIZE SLIDER
// ════════════════════════════════════════════════════════════════════════════
function initSizeSlider() {
  const track = document.getElementById('size-track');
  const thumb = document.getElementById('size-thumb');
  const minSize = 1, maxSize = 20;
  let dragging = false;

  function updateFromY(clientY) {
    const r = track.getBoundingClientRect();
    let t = (clientY - r.top) / r.height;
    t = Math.max(0, Math.min(1, t));
    // Inverted: top = large, bottom = small
    currentSize = maxSize - t * (maxSize - minSize);
    thumb.style.top = (t * 100) + '%';
    document.getElementById('size-display').textContent = Math.round(currentSize) + 'px';
  }

  // Set initial position
  const initT = 1 - (currentSize - minSize) / (maxSize - minSize);
  thumb.style.top = (initT * 100) + '%';

  thumb.addEventListener('pointerdown', e => {
    e.stopPropagation();
    dragging = true;
    thumb.setPointerCapture(e.pointerId);
  });
  thumb.addEventListener('pointermove', e => { if (dragging) updateFromY(e.clientY); });
  thumb.addEventListener('pointerup', () => dragging = false);
  track.addEventListener('click', e => updateFromY(e.clientY));
}

// ════════════════════════════════════════════════════════════════════════════
// UNDO / REDO
// ════════════════════════════════════════════════════════════════════════════
function undo() {
  const page = pages[currentPage];
  if (!page.strokes.length) return;
  const stroke = page.strokes.pop();
  page.redoStack.push(stroke);
  redrawAll();
  toast('Undo');
}

function redo() {
  const page = pages[currentPage];
  if (!page.redoStack.length) return;
  const stroke = page.redoStack.pop();
  page.strokes.push(stroke);
  replayStroke(stroke);
  toast('Redo');
}

function clearPage() {
  if (!confirm('Clear this page?')) return;
  const page = pages[currentPage];
  page.redoStack = [];
  page.undoStack = [];
  page.strokes = [];
  redrawAll();
  toast('Page cleared');
}

// ════════════════════════════════════════════════════════════════════════════
// EXPORT
// ════════════════════════════════════════════════════════════════════════════
function exportPNG() {
  const link = document.createElement('a');
  link.download = `inkwell-page${currentPage+1}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
  toast('Exported PNG ✓');
}

// ════════════════════════════════════════════════════════════════════════════
// KEYBOARD
// ════════════════════════════════════════════════════════════════════════════
function onKey(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if ((e.ctrlKey||e.metaKey) && e.key==='z') { e.preventDefault(); undo(); }
  if ((e.ctrlKey||e.metaKey) && (e.key==='y'||(e.shiftKey&&e.key==='z'))) { e.preventDefault(); redo(); }
  if (e.key==='p') setTool('pen');
  if (e.key==='b') setTool('brush');
  if (e.key==='h') setTool('highlighter');
  if (e.key==='e') setTool('eraser');
  if (e.key==='m') setTool('marker');
  if (e.key==='[') currentSize = Math.max(1, currentSize-1);
  if (e.key===']') currentSize = Math.min(20, currentSize+1);
}

// ════════════════════════════════════════════════════════════════════════════
// AI
// ════════════════════════════════════════════════════════════════════════════
function handleApiKey(val) {
  apiKey = val.trim();
  localStorage.setItem('inkwell_key', apiKey);
  if (apiKey.startsWith('sk-ant-')) setKeyStatus('ok','Key saved ✓');
  else if (apiKey.length > 0) setKeyStatus('err','Should start with sk-ant-');
  else setKeyStatus('','');
}
function setKeyStatus(type, msg) {
  const el = document.getElementById('ai-key-status');
  el.textContent = msg;
  el.className = 'ai-key-status' + (type ? ' '+type : '');
}

function toggleAI() {
  const panel = document.getElementById('ai-panel');
  const btn = document.getElementById('btn-ai');
  panel.classList.toggle('open');
  btn.classList.toggle('active', panel.classList.contains('open'));
}

function aiPrompt(text) {
  document.getElementById('ai-textarea').value = text;
  sendAI();
}

function addMsg(role, text) {
  const convo = document.getElementById('ai-convo');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  convo.appendChild(div);
  convo.scrollTop = convo.scrollHeight;
  return div;
}

async function sendAI() {
  const ta = document.getElementById('ai-textarea');
  const msg = ta.value.trim();
  if (!msg) return;
  if (!apiKey) { toast('Add your API key first'); return; }

  addMsg('user', msg);
  ta.value = '';
  aiHistory.push({role:'user', content: msg});

  const thinking = addMsg('ai-thinking', '…');
  document.getElementById('btn-send-ai').disabled = true;

  // Build context from current page strokes count
  const page = pages[currentPage];
  const system = `You are an AI assistant embedded in a handwriting notes app called Inkwell. 
The user is currently on Page ${currentPage+1} which has ${page.strokes.length} drawn strokes.
Since this is a drawing/handwriting app, you cannot see the actual handwriting — but you can help the user think about their notes, suggest organization strategies, provide writing prompts, summarize what they describe, and assist with thinking through ideas.
Be concise and practical. Use short paragraphs.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 500,
        system,
        messages: aiHistory
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const reply = data.content?.[0]?.text || '';
    thinking.remove();
    addMsg('ai', reply);
    aiHistory.push({role:'assistant', content: reply});
  } catch(err) {
    thinking.textContent = '⚠ ' + (err.message || 'Error — check API key');
    thinking.className = 'msg ai';
  } finally {
    document.getElementById('btn-send-ai').disabled = false;
  }
}

// ════════════════════════════════════════════════════════════════════════════
// TOAST
// ════════════════════════════════════════════════════════════════════════════
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ── RUN ──
init();
</script>
</body>
</html>
